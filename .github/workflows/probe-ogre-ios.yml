name: Probe OGRE iOS build

# Milestone 3. OGRE 1.11.6 contains its own iOS support: an EAGL backend for the
# GLES2 render system (src/EAGL/*.mm), an iOS platform layer (src/iOS/*.mm) and
# an APPLE_IOS branch in its CMake that forces GLES2 + static + PVRTC.
#
# So the question is no longer "does OGRE support iOS" (it does, in source), but
# "does OGRE 1.11.6 still BUILD with a 2025 Xcode and the iOS 18 SDK". The source
# is from ~2016, so this is where the real risk lives.
#
# Two configuration routes are attempted in one run, because they fail
# differently and we want both error lists:
#   1. OGRE's own toolchain      (CMake/toolchain/ios.toolchain.xcode.cmake)
#   2. Modern CMake iOS support  (CMAKE_SYSTEM_NAME=iOS + -DAPPLE_IOS=TRUE)
#
# Conan is deliberately NOT used here: fighting desktop-era recipes for ancient
# C libraries is a rabbit hole. OGRE knows how to build its own iOS deps
# (zziplib, freetype) and takes zlib from the iOS SDK.

on:
  workflow_dispatch:
  push:
    branches: [probe]

permissions:
  contents: read

jobs:
  ogre-ios:
    name: Build OGRE 1.11.6 for iPhone
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          cmake --version | head -1
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos --show-sdk-version

      - name: Get OGRE 1.11.6
        run: git clone --depth 1 --branch v1.11.6 https://github.com/OGRECave/ogre.git ogre

      - name: Route 1 - OGRE's own iOS toolchain
        working-directory: ogre
        run: |
          mkdir -p ../logs
          {
            echo "=== Route 1: OGRE toolchain ==="
            cmake -S . -B build-tc -G Xcode \
              -DCMAKE_TOOLCHAIN_FILE="$PWD/CMake/toolchain/ios.toolchain.xcode.cmake" \
              -DIOS_PLATFORM=OS \
              -DOGRE_BUILD_PLATFORM_APPLE_IOS=TRUE \
              -DOGRE_BUILD_DEPENDENCIES=TRUE \
              -DOGRE_BUILD_SAMPLES=FALSE \
              -DOGRE_BUILD_TESTS=FALSE \
              -DOGRE_BUILD_TOOLS=FALSE \
              -DOGRE_BUILD_COMPONENT_PYTHON=FALSE \
              -DOGRE_BUILD_COMPONENT_JAVA=FALSE \
              -DOGRE_BUILD_COMPONENT_CSHARP=FALSE \
              -DOGRE_BUILD_COMPONENT_VOLUME=FALSE \
              -DOGRE_BUILD_PLUGIN_BSP=FALSE \
              -DOGRE_BUILD_PLUGIN_CG=FALSE \
              -DOGRE_BUILD_PLUGIN_PCZ=FALSE \
              -DOGRE_BUILD_PLUGIN_OCTREE=FALSE \
              -DOGRE_BUILD_PLUGIN_DOT_SCENE=FALSE \
              -DOGRE_BUILD_RENDERSYSTEM_GL=FALSE \
              -DOGRE_BUILD_RENDERSYSTEM_GL3PLUS=FALSE \
              -DOGRE_BUILD_RENDERSYSTEM_GLES2=TRUE \
              -DOGRE_STATIC=TRUE
          } 2>&1 | tee ../logs/r1-configure.log
          echo "route1 configure exit: $?"
        continue-on-error: true

      - name: Route 1 - build targets
        working-directory: ogre
        run: |
          if [ -d build-tc/OGRE.xcodeproj ]; then
            for T in OgreMain RenderSystem_GLES2 OgreOverlay; do
              echo "########## route1 $T ##########"
              xcodebuild -project build-tc/OGRE.xcodeproj -target "$T" -configuration Release \
                -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
                2>&1 | tee "../logs/r1-build-$T.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" | tail -25
            done
          else
            echo "route1: no Xcode project was generated"
          fi
        continue-on-error: true

      - name: Route 2 - modern CMake iOS support
        working-directory: ogre
        run: |
          {
            echo "=== Route 2: modern CMAKE_SYSTEM_NAME=iOS ==="
            cmake -S . -B build-modern -G Xcode \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
              -DAPPLE_IOS=TRUE \
              -DOGRE_BUILD_PLATFORM_APPLE_IOS=TRUE \
              -DOGRE_BUILD_DEPENDENCIES=TRUE \
              -DOGRE_BUILD_SAMPLES=FALSE \
              -DOGRE_BUILD_TESTS=FALSE \
              -DOGRE_BUILD_TOOLS=FALSE \
              -DOGRE_BUILD_COMPONENT_PYTHON=FALSE \
              -DOGRE_BUILD_COMPONENT_JAVA=FALSE \
              -DOGRE_BUILD_COMPONENT_CSHARP=FALSE \
              -DOGRE_BUILD_COMPONENT_VOLUME=FALSE \
              -DOGRE_BUILD_PLUGIN_BSP=FALSE \
              -DOGRE_BUILD_PLUGIN_CG=FALSE \
              -DOGRE_BUILD_PLUGIN_PCZ=FALSE \
              -DOGRE_BUILD_PLUGIN_OCTREE=FALSE \
              -DOGRE_BUILD_PLUGIN_DOT_SCENE=FALSE \
              -DOGRE_BUILD_RENDERSYSTEM_GL=FALSE \
              -DOGRE_BUILD_RENDERSYSTEM_GL3PLUS=FALSE \
              -DOGRE_BUILD_RENDERSYSTEM_GLES2=TRUE \
              -DOGRE_STATIC=TRUE
          } 2>&1 | tee ../logs/r2-configure.log
          echo "route2 configure exit: $?"
        continue-on-error: true

      - name: Route 2 - build targets
        working-directory: ogre
        run: |
          if [ -d build-modern/OGRE.xcodeproj ]; then
            for T in OgreMain RenderSystem_GLES2 OgreOverlay; do
              echo "########## route2 $T ##########"
              xcodebuild -project build-modern/OGRE.xcodeproj -target "$T" -configuration Release \
                -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
                2>&1 | tee "../logs/r2-build-$T.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" | tail -25
            done
          else
            echo "route2: no Xcode project was generated"
          fi
        continue-on-error: true

      - name: Summary
        if: always()
        working-directory: ogre
        run: |
          {
            echo "## OGRE 1.11.6 on iPhone"
            echo
            for R in r1 r2; do
              echo "### Route $R"
              echo '```'
              grep -E 'error:|CMake Error|Could NOT find|Not Found|APPLE_IOS|OpenGLES2|FREETYPE' ../logs/$R-configure.log 2>/dev/null | head -25 || echo "(no configure log)"
              echo '```'
              for T in OgreMain RenderSystem_GLES2 OgreOverlay; do
                if [ -f "../logs/$R-build-$T.log" ]; then
                  N=$(grep -cE 'error:' "../logs/$R-build-$T.log" 2>/dev/null || echo 0)
                  S=$(grep -cE 'BUILD SUCCEEDED' "../logs/$R-build-$T.log" 2>/dev/null || echo 0)
                  echo "- **$T**: $N error(s), success=$S"
                fi
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogre-ios-logs
          path: logs/
          retention-days: 30
          if-no-files-found: warn
