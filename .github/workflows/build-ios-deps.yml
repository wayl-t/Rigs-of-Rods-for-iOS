name: Build iOS dependency SDK

# Milestone 7.
#
# probe-ogre-ios.yml proved OGRE 1.11.6 configures and builds OgreMain +
# RenderSystem_GLES2 for iphoneos/arm64 via plain modern CMake
# (-DCMAKE_SYSTEM_NAME=iOS ...). It also proved what is MISSING: with no
# FreeType, OGRE silently drops the Overlay and Bites components, and RoR
# cannot compile without them:
#
#   source/main/pch.h:34  #include <Bites/OgreWindowEventUtilities.h>
#   source/main/pch.h:35  #include <Overlay/OgreFontManager.h>
#
# OGRE's own -DOGRE_BUILD_DEPENDENCIES=TRUE cannot help: its ExternalProject
# build of freetype dies on `cmake_minimum_required` (< 3.5) because the
# nested configure does not inherit our -DCMAKE_POLICY_VERSION_MINIMUM=3.5,
# and its zziplib ExternalProject fails outright ("** BUILD FAILED **" in
# zzipfseeko.pc).  zziplib is therefore built here by hand - see the
# "zziplib" section below, it is what turns OGRE's Zip archive support on
# and the port cannot open a single RoR resource pack without it.
#
# So this workflow cross-compiles the whole base of the iOS dependency SDK:
#
#   FreeType     (enables OGRE Overlay + Bites, and MyGUI's font loading)
#   zziplib      (OGRE's Zip archive backend - MANDATORY, see below)
#   OGRE         (OgreMain + Bites + Overlay + Paging + RTShaderSystem
#                 + MeshLodGenerator + Terrain + Octree/PFX plugins
#                 + GLES2 render system, static)
#   OIS          (iPhone multitouch backend, src/iphone/*.mm)
#   fmt          (fmt::fmt)
#   RapidJSON    (header-only + synthesized RapidJSONConfig.cmake)
#   SocketW      (SocketW::SocketW; no OpenSSL - plain-TCP master server)
#   AngelScript  (Angelscript::angelscript; arm64 arch-detection patch)
#   openal-soft  (libopenal.a)
#   MyGUI        (libMyGUIEngine.a + libMyGUI.OgrePlatform.a + MyGUI:: targets)
#   PagedGeometry(libPagedGeometry.a; bypasses its pkg-config-only build)
#
# Everything is installed into one prefix which is uploaded as an artifact so
# the next milestone (RoR itself) can consume it unchanged.
#
# Every dependency step is continue-on-error so a single dispatch reports on
# ALL of them; the final "Verify full iOS SDK" step is the real gate.

on:
  workflow_dispatch:
  push:
    branches: [probe]

permissions:
  contents: read

env:
  # Must match build-ror-ios.yml.  Kept at 13.0 so the IPA runs on every arm64
  # iPhone; 16.0 made iOS refuse to install it on anything older.
  IOS_DEPLOYMENT_TARGET: "13.0"

jobs:
  ogre-ios-sdk:
    name: FreeType + OGRE for iphoneos/arm64
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Shared cmake flags
        run: |
          mkdir -p logs
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "IOS_SYSROOT=$SDK"                    >> $GITHUB_ENV
          echo "IOS_PREFIX=$GITHUB_WORKSPACE/ios-sdk" >> $GITHUB_ENV
          echo "sdk=$SDK"

      # ---------------------------------------------------------------- #
      # FreeType                                                          #
      # ---------------------------------------------------------------- #
      - name: Get FreeType
        run: |
          # GitHub mirror of freetype; tag VER-2-13-3 is the current stable.
          git clone --depth 1 --branch VER-2-13-3 \
            https://github.com/freetype/freetype.git freetype

      - name: Configure FreeType (iOS, static)
        run: |
          cmake -S freetype -B freetype/build -G Xcode \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_DEPLOYMENT_TARGET \
            -DCMAKE_OSX_SYSROOT="$IOS_SYSROOT" \
            -DCMAKE_INSTALL_PREFIX="$IOS_PREFIX" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_HARFBUZZ=TRUE \
            -DFT_DISABLE_BZIP2=TRUE \
            -DFT_DISABLE_PNG=TRUE \
            -DFT_DISABLE_BROTLI=TRUE \
            -DFT_DISABLE_ZLIB=TRUE \
            2>&1 | tee logs/ft-configure.log

      - name: Build + install FreeType
        run: |
          cmake --build freetype/build --config Release --target install \
            2>&1 | tee logs/ft-build.log
          echo "----- installed -----"
          find "$IOS_PREFIX" -type f | sort

      # ---------------------------------------------------------------- #
      # zziplib - OGRE's Zip archive backend (MANDATORY)                  #
      #                                                                   #
      # OGRE gates ALL Zip archive support on ZZip_FOUND:                 #
      #   CMakeLists.txt:375                                              #
      #     cmake_dependent_option(OGRE_CONFIG_ENABLE_ZIP "... " TRUE     #
      #                            "ZZip_FOUND" FALSE)                    #
      # With no zziplib the option silently resolves to FALSE,            #
      # OgreMain/CMakeLists.txt:156 then never compiles OgreZip.cpp,      #
      # OgreBuildSettings.h gets `#define OGRE_NO_ZIP_ARCHIVE 1`, and     #
      # ArchiveManager never registers a "Zip" factory - the OGRE log     #
      # has no "ArchiveFactory for archive type Zip registered." line.    #
      #                                                                   #
      # That is fatal for RoR: every resource pack it ships is a .zip     #
      # (skeleton.zip, wallpapers.zip, meshes.zip, ...) and both the      #
      # ResourceGroupManager::addResourceLocation() callers and          #
      # ContentManager::AddResourcePack() name them as "Zip".  The first  #
      # one, AppContext::SetUpConfigSkeleton(), runs immediately after    #
      # the render window exists - which is exactly where the app died on #
      # device:                                                           #
      #   [trace] startup: OGRE is up and the render window was created   #
      #   [crash] SIGSEGV - invalid memory access                         #
      #                                                                   #
      # zziplib is built with our own cross-toolchain flags and installed #
      # into the SDK prefix, where OGRE's CMake/Packages/FindZZip.cmake   #
      # (module mode wins over zziplib's own zzip-config.cmake) finds      #
      # `zzip/zzip.h` and `libzzip.a`.                                    #
      #                                                                   #
      # Only the base libzzip is built.  ZZIPMMAPPED and ZZIPFSEEKO are   #
      # off (OGRE uses neither, and mmap'd access is the one portability  #
      # trap in the library); the compat/libtool/pkg-config extras and    #
      # the example/binary/doc targets want bash and only make noise on   #
      # iOS.  zlib comes from the SDK itself                              #
      # ($IOS_SYSROOT/usr/lib/libz.tbd) - the same stub RoR already links.#
      # ---------------------------------------------------------------- #
      - name: Get zziplib 0.13.78
        run: |
          git clone --depth 1 --branch v0.13.78 \
            https://github.com/gdraheim/zziplib.git zziplib

      - name: Configure zziplib (iOS, static, base libzzip only)
        run: |
          cmake -S zziplib -B zziplib/build -G "Unix Makefiles" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_DEPLOYMENT_TARGET \
            -DCMAKE_OSX_SYSROOT="$IOS_SYSROOT" \
            -DCMAKE_INSTALL_PREFIX="$IOS_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=FALSE \
            -DBUILD_TESTS=FALSE \
            -DZZIPMMAPPED=OFF -DZZIPFSEEKO=OFF \
            -DZZIP_COMPAT=OFF -DZZIP_LIBTOOL=OFF -DZZIP_PKGCONFIG=OFF \
            -DZZIPWRAP=OFF -DZZIPSDL=OFF -DZZIPBINS=OFF -DZZIPTEST=OFF \
            -DZZIPDOCS=OFF \
            -DZLIB_LIBRARY="$IOS_SYSROOT/usr/lib/libz.tbd" \
            -DZLIB_INCLUDE_DIR="$IOS_SYSROOT/usr/include" \
            2>&1 | tee logs/zzip-configure.log

      - name: Build + install zziplib
        run: |
          cmake --build zziplib/build -j $(sysctl -n hw.ncpu) 2>&1 | tee logs/zzip-build.log
          cmake --build zziplib/build --target install 2>&1 | tee logs/zzip-install.log

          # zziplib sets RELEASE_POSTFIX "-0" on libzzip
          # (zzip/CMakeLists.txt: set_target_properties(libzzip PROPERTIES
          #  OUTPUT_NAME "zzip" RELEASE_POSTFIX "-${RELNUM}")), so a Release
          # static build installs lib/libzzip-0.a.  OGRE's FindZZip searches
          # the names `zziplib zzip zzip-0`, so either file resolves, but the
          # RoR workflow also links with -L$IOS_PREFIX/lib, and the canonical
          # unsuffixed name is what makes a plain `-lzzip` work too.
          if [ ! -f "$IOS_PREFIX/lib/libzzip.a" ]; then
            src="$(find "$IOS_PREFIX" -name 'libzzip*.a' -print -quit)"
            if [ -n "$src" ]; then
              echo "copying $src -> $IOS_PREFIX/lib/libzzip.a"
              cp -f "$src" "$IOS_PREFIX/lib/libzzip.a"
            fi
          fi

          echo "----- installed zzip artefacts -----"
          find "$IOS_PREFIX" -name '*zzip*' -maxdepth 3 | sort | head -40
          echo "----- zzip build errors -----"
          grep -E 'error:' logs/zzip-build.log | head -20 || echo "(none)"

          [ -f "$IOS_PREFIX/include/zzip/zzip.h" ] || { echo "ERROR: zziplib did not install include/zzip/zzip.h"; exit 1; }
          [ -f "$IOS_PREFIX/lib/libzzip.a" ]       || { echo "ERROR: zziplib did not produce libzzip.a"; exit 1; }
          echo "----- arch check -----"
          lipo -info "$IOS_PREFIX/lib/libzzip.a"
          echo "----- zzip.h location -----"
          ls "$IOS_PREFIX/include/zzip" | head -30

      # ---------------------------------------------------------------- #
      # OGRE 1.11.6                                                       #
      # ---------------------------------------------------------------- #
      - name: Get OGRE 1.11.6
        run: git clone --depth 1 --branch v1.11.6 https://github.com/OGRECave/ogre.git ogre

      - name: "Patch OGRE: EAGL2View::layoutSubviews must survive a camera-less viewport"
        run: |
          # UIKit calls -[EAGL2View layoutSubviews] on the first pass of the
          # run loop.  RoR pumps the run loop during startup (every iOS
          # breadcrumb in patches/ror/apply_ios_patches.py calls
          # CFRunLoopRunInMode), and at that moment RoR's only viewport exists
          # but still has no camera:
          #
          #   source/main/AppContext.cpp:432
          #       // Create viewport (without camera)
          #       m_viewport = m_render_window->addViewport(/*camera=*/nullptr);
          #
          #   ... much later, after the whole startup sequence ...
          #
          #   source/main/gfx/camera/CameraManager.cpp:123
          #       App::GetAppContext()->GetViewport()->setCamera(m_camera);
          #
          # OGRE 1.11.6 guards the viewport COUNT but never the camera:
          #
          #   if(window->getNumViewports() > 0)
          #   {
          #       Ogre::Viewport *viewPort = window->getViewport(0);
          #       viewPort->getCamera()->setAspectRatio(...);   // NULL here
          #   }
          #
          # The device trace of ror-zipfix.ipa pins this exactly (both launches
          # of the same binary crash at identical offsets):
          #
          #   pc   = Ogre::Frustum::setAspectRatio(float) + 0x0
          #   lr   = -[EAGL2View layoutSubviews] + 0xb4
          #   addr = 0x130        (== NULL + offsetof(Frustum, mAspectRatio))
          #
          # i.e. a devirtualised call on a NULL Ogre::Camera.  Guard it.
          f=ogre/RenderSystems/GLES2/src/EAGL/OgreEAGL2View.mm
          python3 - "$f" <<'PY'
          import sys
          p = sys.argv[1]
          d = open(p, "r", encoding="utf-8", errors="replace").read()

          old = '            viewPort->getCamera()->setAspectRatio((Real) width / (Real) height);\n'

          new = '            // Apple/iOS port: -[EAGL2View layoutSubviews] runs on the\n' \
                '            // first run-loop pass, which can be before RoR attaches a\n' \
                '            // camera to its viewport (AppContext.cpp adds the viewport\n' \
                '            // with a null camera, CameraManager attaches it later), so\n' \
                '            // getCamera() can legitimately be NULL here.\n' \
                '            if(viewPort != NULL && viewPort->getCamera() != NULL)\n' \
                '            {\n' \
                '                viewPort->getCamera()->setAspectRatio((Real) width / (Real) height);\n' \
                '            }\n'

          assert old in d, "OgreEAGL2View layoutSubviews anchor missing"
          d = d.replace(old, new, 1)
          open(p, "w", encoding="utf-8").write(d)
          print("patched")
          PY
          grep -n 'getCamera() != NULL' "$f"
          sed -n '70,92p' "$f"

      - name: "Patch OGRE: the GLSL preprocessor must not blank the terrain"
        run: |
          # Device evidence (rtss12 build, RoR.log at 10:34:08, immediately
          # after 'Terrain created; size=1025 minBatch=17 maxBatch=65 ...'):
          #
          #   RenderingAPIException: Failed to preprocess shader
          #     OgreTerrain/629172533/sm2/vp/hlod/hlod in loadFromSource at
          #     ogre/RenderSystems/GLSupport/src/GLSL/OgreGLSLShaderCommon.cpp (line 132)
          #   High-level program '...' is not supported: Failed to preprocess shader ...
          #   Warning: material OgreTerrain/629172533 has no supportable
          #     Techniques and will be blank.  Explanation:
          #     Pass 0: vertex program .../sm2/vp/hlod/hlod cannot be used - compile error.
          #
          # All six terrain programs (hlod/llod/comp, vp+fp) fail, so the
          # terrain material is blank - that is the "artifact" visible in the
          # 3D scene.  The source itself is plain GLSL ES assembled by
          # Components/Terrain/src/OgreTerrainMaterialShaderHelperGLSL.cpp (no
          # #include, no #if) and _resolveIncludes() has already run by then.
          #
          # Why RoR.log carries no explanation: cpp.Parse() reports through
          # CPreprocessor::ErrorHandler -> DefaultError, which logs at
          # LML_CRITICAL, and Log::logMessage drops messages whose level is
          # above the log's own detail level (LML_NORMAL by default).  The one
          # line that names the offending construct never reaches the device.
          #
          # Two changes:
          #   1. Route the preprocessor's diagnostics to LML_NORMAL, so the next
          #      device trace names the exact line and construct.
          #   2. When preprocessing yields nothing, compile the include-resolved
          #      source instead of discarding the material - GLSL ES has its own
          #      preprocessor, so the raw source is compilable as it stands.
          f=ogre/RenderSystems/GLSupport/src/GLSL/OgreGLSLShaderCommon.cpp
          python3 - "$f" <<'PY'
          import sys
          p = sys.argv[1]
          d = open(p, "r", encoding="utf-8", errors="replace").read()

          anchor = ('    //-----------------------------------------------------------------------\n'
                    '    void GLSLShaderCommon::loadFromSource(void)\n')

          handler = (
              '    //-----------------------------------------------------------------------\n'
              '    // Apple/iOS port: OGRE preprocessor diagnostics go to\n'
              '    // CPreprocessor::ErrorHandler, whose default sink logs at\n'
              '    // LML_CRITICAL - a level the default log never forwards - which is\n'
              '    // why the terrain-shader failure handled below reached the device\n'
              '    // with no explanation at all.  Report them at the normal level so\n'
              '    // the trace can name the offending line and construct.\n'
              '    static void iosGlslPreprocError(void *iData, int iLine, const char *iError,\n'
              '                                    const char *iToken, size_t iTokenLen)\n'
              '    {\n'
              '        (void)iData;\n'
              '        String line = "[ogre-preproc] line " + StringConverter::toString(iLine)\n'
              '                     + ": " + (iError ? iError : "(no error text)");\n'
              '        if (iToken)\n'
              '            line += String(" `") + String(iToken, iTokenLen) + "\'";\n'
              '        LogManager::getSingleton().logMessage(line, LML_NORMAL);\n'
              '    }\n'
              '\n')

          assert anchor in d, "loadFromSource anchor missing"
          d = d.replace(anchor, handler + anchor, 1)

          old = ('        size_t out_size = 0;\n'
                 '        const char *src = mSource.c_str ();\n'
                 '        size_t src_len = mSource.size ();\n'
                 '        char *out = cpp.Parse (src, src_len, out_size);\n'
                 '        if (!out || !out_size)\n'
                 '            // Failed to preprocess, break out\n'
                 '            OGRE_EXCEPT(Exception::ERR_RENDERINGAPI_ERROR, "Failed to preprocess shader " + mName);\n'
                 '\n'
                 '        mSource = String (out, out_size);\n'
                 '        if (out < src || out > src + src_len)\n'
                 '            free (out);\n')

          new = ('        // Apple/iOS port: report this shader\'s preprocessor diagnostics\n'
                 '        // through the LML_NORMAL handler while parsing it.\n'
                 '        CPreprocessor::ErrorHandlerFunc iosPrevHandler = CPreprocessor::ErrorHandler;\n'
                 '        CPreprocessor::ErrorHandler = iosGlslPreprocError;\n'
                 '\n'
                 '        size_t out_size = 0;\n'
                 '        const char *src = mSource.c_str ();\n'
                 '        size_t src_len = mSource.size ();\n'
                 '        char *out = cpp.Parse (src, src_len, out_size);\n'
                 '\n'
                 '        CPreprocessor::ErrorHandler = iosPrevHandler;\n'
                 '\n'
                 '        if (!out || !out_size)\n'
                 '        {\n'
                 '            // Apple/iOS port: this is where the OGRE Terrain shaders\n'
                 '            // used to die - the material then reported "no supportable\n'
                 '            // Techniques" and the whole terrain rendered blank.  The\n'
                 '            // includes are already resolved above and GLSL ES runs its\n'
                 '            // own preprocessor, so the source is compilable as it\n'
                 '            // stands: hand it to the driver instead of discarding the\n'
                 '            // material.\n'
                 '            if (out)\n'
                 '            {\n'
                 '                if (out >= src && out <= src + src_len)\n'
                 '                    out = NULL; // zero-length view into src, nothing to free\n'
                 '                else\n'
                 '                    free (out);\n'
                 '            }\n'
                 '\n'
                 '            String snippet = mSource.substr(0, 120);\n'
                 '            size_t iosNL = snippet.find_first_of("\\r\\n");\n'
                 '            if (iosNL != String::npos)\n'
                 '                snippet.erase(iosNL);\n'
                 '            LogManager::getSingleton().logWarning(\n'
                 '                "GLSL: preprocessor produced nothing for " + getResourceLogName()\n'
                 '                + " (src_len=" + StringConverter::toString(src_len)\n'
                 '                + "); compiling the raw source. head: " + snippet);\n'
                 '        }\n'
                 '        else\n'
                 '        {\n'
                 '            mSource = String (out, out_size);\n'
                 '            if (out < src || out > src + src_len)\n'
                 '                free (out);\n'
                 '        }\n')

          assert old in d, "preprocessor block anchor missing"
          d = d.replace(old, new, 1)
          open(p, "w", encoding="utf-8").write(d)
          print("patched")
          PY
          grep -n 'iosGlslPreprocError\|preprocessor produced nothing' "$f"
          sed -n '/void GLSLShaderCommon::loadFromSource/,/^        compile(true);/p' "$f" | head -75

      - name: Pin FindZZip to the zziplib in the SDK prefix
        run: |
          # OGRE's stock CMake/Packages/FindZZip.cmake cannot see our zziplib.
          # The configure log of the first attempt says exactly why:
          #
          #   -- Looking for ZZip...
          #   -- ZZip_PREFIX_PATH changed.
          #   -- Checking for module 'zziplib'
          #   --   Package 'zziplib' not found
          #   -- Could not locate ZZip
          #
          # Two independent reasons:
          #
          #   * clear_if_changed() fires.  It compares ZZip_PREFIX_PATH with the
          #     ZZip_PREFIX_PATH_LAST it stores in the cache, and on a fresh
          #     build directory that stored value is empty, so the very first
          #     configure wipes ZZip_INCLUDE_DIR / ZZip_LIBRARY_REL - every
          #     -DZZip_* hint passed on the command line is discarded before
          #     find_path() ever looks at it.
          #   * after that the module falls back to find_path/find_library,
          #     which the iOS cross toolchain confines to its root paths (the
          #     iPhoneOS SDK plus OGRE's empty iOSDependencies trees), so
          #     $IOS_PREFIX is not reachable.  Freetype only works because its
          #     path is pinned through FREETYPE_LIBRARY, and hand-pinning is
          #     what this workflow does for every single dependency.
          #
          # Replacing the module is both simpler and more honest than fighting
          # the search: OGRE reads nothing from it except ZZip_FOUND,
          # ZZip_INCLUDE_DIRS and ZZip_LIBRARIES.  With ZZip_FOUND TRUE,
          # CMakeLists.txt:375 keeps OGRE_CONFIG_ENABLE_ZIP at its default TRUE
          # instead of forcing it to FALSE.
          {
            echo '# Written by .github/workflows/build-ios-deps.yml.'
            echo '#'
            echo '# Replaces OGRE 1.11.6 CMake/Packages/FindZZip.cmake, which cannot'
            echo '# work in this cross build: its clear_if_changed() drops any'
            echo '# pre-set ZZip_* cache entry on the first configure, and the iOS'
            echo '# toolchain then confines find_path/find_library to the SDK root'
            echo '# paths, so the zziplib installed under $IOS_PREFIX is invisible.'
            echo '#'
            echo '# OGRE consumes only the three variables below.'
            echo 'set(ZZip_FOUND TRUE)'
            echo "set(ZZip_INCLUDE_DIRS \"$IOS_PREFIX/include\")"
            echo "set(ZZip_LIBRARIES \"$IOS_PREFIX/lib/libzzip.a\")"
            echo "set(ZZip_INCLUDE_DIR \"$IOS_PREFIX/include\")"
          } > ogre/CMake/Packages/FindZZip.cmake

          [ -f "$IOS_PREFIX/lib/libzzip.a" ]   || { echo "ERROR: libzzip.a missing - the zziplib steps must run first"; exit 1; }
          [ -f "$IOS_PREFIX/include/zzip/zzip.h" ] || { echo "ERROR: zzip/zzip.h missing - the zziplib steps must run first"; exit 1; }
          echo "----- ogre/CMake/Packages/FindZZip.cmake -----"
          cat ogre/CMake/Packages/FindZZip.cmake

      - name: Configure OGRE (iOS, static, full component set)
        run: |
          # OGRE's CMake puts the *literal* string "$(PLATFORM_NAME)" into the
          # library output directory on iOS (CMake/Utils/OgreConfigTargets.cmake:16-20).
          # Xcode expands it at build time -> the libs really land in
          #   ogre/build/lib/iphoneos/Release/
          # but CMake's own install() script does not expand it, so `install`
          # looks in "ogre/build/lib/$(PLATFORM_NAME)/Release/" and dies with
          #   file INSTALL cannot find ".../lib/$(PLATFORM_NAME)/Release/libOgreMainStatic.a"
          # OgreConfigTargets.cmake:24 is `if (NOT OGRE_ARCHIVE_OUTPUT)`, so
          # passing the real path explicitly takes that branch out of play and
          # the build and the installer finally agree on the directory.
          #
          # ZIP archive support: the step above pinned CMake/Packages/FindZZip.cmake
          # to the zziplib install, so ZZip_FOUND is TRUE here, CMakeLists.txt:375
          # leaves OGRE_CONFIG_ENABLE_ZIP at its default TRUE, OgreMain compiles
          # OgreZip.cpp and ArchiveManager registers the "Zip" factory RoR needs
          # for every resource pack.  The assert step below fails the run if that
          # ever stops being true.
          # ZLIB_* is the SDK stub zziplib itself was built against; OGRE links
          # ZLIB::ZLIB into OgreMain as soon as zip is on.
          #
          # OGRE_RESOURCEMANAGER_STRICT=0: OGRE 1.10+ defaults this to 2, which
          # makes every resource group self-contained - createResourceGroup()'s
          # inGlobalPool defaults to !STRICT, so a material in MaterialsRG can
          # NOT resolve a texture that lives in a different group.  RoR's
          # dashboard scripts reference textures (adi.dds, whiteneedle.dds,
          # speedo.dds, ...) that recursive_zip_folder packed into
          # textures.zip -> TexturesRG, while the .material files that use them
          # are in materials.zip -> MaterialsRG: with STRICT=2 every gauge came
          # up blank ("Cannot locate resource adi.dds in resource group
          # MaterialsRG").  RoR desktop pins the opposite setting (conanfile.py:
          # ogre3d*:resourcemanager_strict = "off"), which is why it renders the
          # same content fine; match it so cross-group lookups work again.
          cmake -S ogre -B ogre/build -G Xcode \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_DEPLOYMENT_TARGET \
            -DCMAKE_OSX_SYSROOT="$IOS_SYSROOT" \
            -DCMAKE_INSTALL_PREFIX="$IOS_PREFIX" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DOGRE_ARCHIVE_OUTPUT="$PWD/ogre/build/lib/iphoneos" \
            -DOGRE_LIBRARY_OUTPUT="$PWD/ogre/build/lib/iphoneos" \
            -DOGRE_RUNTIME_OUTPUT="$PWD/ogre/build/bin" \
            -DAPPLE_IOS=TRUE -DOGRE_BUILD_PLATFORM_APPLE_IOS=TRUE \
            -DOGRE_STATIC=TRUE \
            -DOGRE_BUILD_DEPENDENCIES=FALSE \
            -DOGRE_RESOURCEMANAGER_STRICT=0 \
            -DFREETYPE_LIBRARY="$IOS_PREFIX/lib/libfreetype.a" \
            -DFREETYPE_INCLUDE_DIRS="$IOS_PREFIX/include/freetype2" \
            -DZLIB_LIBRARY="$IOS_SYSROOT/usr/lib/libz.tbd" \
            -DZLIB_INCLUDE_DIR="$IOS_SYSROOT/usr/include" \
            -DOGRE_BUILD_SAMPLES=FALSE \
            -DOGRE_BUILD_TESTS=FALSE \
            -DOGRE_BUILD_TOOLS=FALSE \
            -DOGRE_BUILD_COMPONENT_PYTHON=FALSE \
            -DOGRE_BUILD_COMPONENT_JAVA=FALSE \
            -DOGRE_BUILD_COMPONENT_CSHARP=FALSE \
            -DOGRE_BUILD_COMPONENT_VOLUME=FALSE \
            -DOGRE_BUILD_COMPONENT_OVERLAY=TRUE \
            -DOGRE_BUILD_COMPONENT_BITES=TRUE \
            -DOGRE_BUILD_COMPONENT_PAGING=TRUE \
            -DOGRE_BUILD_COMPONENT_PROPERTY=FALSE \
            -DOGRE_BUILD_COMPONENT_TERRAIN=TRUE \
            -DOGRE_BUILD_COMPONENT_RTSHADERSYSTEM=TRUE \
            -DOGRE_BUILD_COMPONENT_MESHLODGENERATOR=TRUE \
            -DOGRE_BUILD_PLUGIN_BSP=FALSE \
            -DOGRE_BUILD_PLUGIN_CG=FALSE \
            -DOGRE_BUILD_PLUGIN_PCZ=FALSE \
            -DOGRE_BUILD_PLUGIN_OCTREE=TRUE \
            -DOGRE_BUILD_PLUGIN_PFX=TRUE \
            -DOGRE_BUILD_PLUGIN_DOT_SCENE=FALSE \
            -DOGRE_BUILD_RENDERSYSTEM_GL=FALSE \
            -DOGRE_BUILD_RENDERSYSTEM_GL3PLUS=FALSE \
            -DOGRE_BUILD_RENDERSYSTEM_GLES2=TRUE \
            2>&1 | tee logs/ogre-configure.log

      - name: Feature summary
        if: always()
        run: |
          echo "## OGRE iOS feature summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          sed -n '/FEATURE SUMMARY/,/^----/p' logs/ogre-configure.log | head -40 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: "Assert OGRE has Zip archive support (OGRE_NO_ZIP_ARCHIVE 0)"
        run: |
          set +e
          # The whole port hinges on this one define.  OGRE writes it into the
          # generated OgreBuildSettings.h at *configure* time, so check it here
          # rather than after the 10-minute build - and dump the evidence that
          # explains a FALSE reading (i.e. FindZZip not finding zziplib).
          f="$(find ogre/build -name OgreBuildSettings.h -print -quit)"
          echo "OgreBuildSettings.h: ${f:-<not generated>}"
          if [ -z "$f" ]; then
            echo "ERROR: OgreBuildSettings.h was not generated by the OGRE configure step"
            exit 1
          fi
          grep -n 'OGRE_NO_ZIP_ARCHIVE' "$f"
          if grep -q '#define OGRE_NO_ZIP_ARCHIVE 0' "$f"; then
            echo "OK: Zip archive support is compiled in (OgreZip.cpp + ZipArchiveFactory)"
            exit 0
          fi
          echo "ERROR: OGRE was configured WITHOUT zziplib."
          echo "       OgreZip.cpp is not compiled, so ArchiveManager has no 'Zip'"
          echo "       factory and the first .zip resource RoR opens (skeleton.zip"
          echo "       in SetUpConfigSkeleton) aborts the app."
          echo "----- zzip / zlib lines from the OGRE configure log -----"
          grep -iE 'zzip|zlib' logs/ogre-configure.log || true
          echo "----- zziplib artefacts in the prefix -----"
          find "$IOS_PREFIX" -name '*zzip*' | sort || true
          echo "----- OGRE feature summary -----"
          sed -n '/FEATURE SUMMARY/,/^----/p' logs/ogre-configure.log | head -60 || true
          exit 1

      - name: Build + install OGRE
        run: |
          cmake --build ogre/build --config Release --target install \
            2>&1 | tee logs/ogre-build.log

      - name: Post-build report
        if: always()
        run: |
          echo "----- built libs (build tree) -----"
          find ogre/build -name '*.a' -exec ls -la {} \; 2>/dev/null | sort -k9 || true
          echo "----- installed tree -----"
          find "$IOS_PREFIX" -type f \( -name '*.a' -o -name '*.h' -o -name '*.cmake' \) | sort | head -200
          echo "----- static libs (install prefix) -----"
          find "$IOS_PREFIX" -name '*.a' -exec ls -la {} \; 2>/dev/null | sort -k9 || true
          echo "----- error lines in OGRE build -----"
          grep -E "error:" logs/ogre-build.log | sort -u | head -60 || true
          echo "----- ZIP archive support -----"
          grep -n 'OGRE_NO_ZIP_ARCHIVE' "$IOS_PREFIX/include/OGRE/OgreBuildSettings.h" || true
          find "$IOS_PREFIX" -name '*zzip*' | sort || true
          # The string literal below only exists in OgreZip.cpp, so finding it
          # inside libOgreMainStatic.a proves OgreZip.cpp was really compiled in
          # (and not silently dropped because OGRE_NO_ZIP_ARCHIVE was 1).
          if strings "$IOS_PREFIX/lib/Release/libOgreMainStatic.a" 2>/dev/null | grep -q 'Modification of zipped archives is not supported'; then
            echo "  ok      libOgreMainStatic.a contains the OgreZip.cpp objects"
          else
            echo "  MISSING libOgreMainStatic.a has no OgreZip.cpp objects"
          fi
          if nm -g "$IOS_PREFIX/lib/Release/libOgreMainStatic.a" 2>/dev/null | grep -q 'ZipArchiveFactory'; then
            echo "  ok      libOgreMainStatic.a defines ZipArchiveFactory"
          else
            echo "  MISSING libOgreMainStatic.a does NOT define ZipArchiveFactory"
          fi
          echo "----- required libs check -----"
          missing=0
          for lib in OgreMain OgreGLSupport OgreBites OgreOverlay OgrePaging \
                     OgreTerrain OgreRTShaderSystem OgreMeshLodGenerator; do
            if ! find "$IOS_PREFIX" -name "lib${lib}Static.a" | grep -q .; then
              echo "MISSING: lib${lib}Static.a"; missing=1
            fi
          done
          for lib in RenderSystem_GLES2 Plugin_OctreeSceneManager Plugin_ParticleFX Codec_STBI; do
            if ! find "$IOS_PREFIX" -name "lib${lib}Static.a" | grep -q .; then
              echo "MISSING: lib${lib}Static.a"; missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "RESULT: some OGRE libraries are NOT installed"; exit 1
          fi
          echo "RESULT: all required OGRE libraries present"
          echo "----- arch check (must be arm64) -----"
          for f in $(find "$IOS_PREFIX" -name '*.a' | head -3); do
            echo "$f"; lipo -info "$f" || true
          done
          lipo -info "$IOS_PREFIX/lib/libfreetype.a" || true

      # ---------------------------------------------------------------- #
      # OIS (Object Oriented Input System)                                #
      #                                                                   #
      # iOS gets its input from UIKit, so we need OIS's real iPhone       #
      # backend (src/iphone/*.mm - multitouch).  The conan recipe never   #
      # selects it; OGRE's misc var OGRE_BUILD_PLATFORM_APPLE_IOS is the  #
      # switch that OIS's CMakeLists looks at.                            #
      # ---------------------------------------------------------------- #
      - name: Get OIS
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/AnotherFoxGuy/conan-OIS.git ois

      - name: Configure OIS (iOS, static, iPhone multitouch backend)
        continue-on-error: true
        run: |
          cmake -S ois -B ois/build -G Ninja \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_DEPLOYMENT_TARGET \
            -DCMAKE_OSX_SYSROOT="$IOS_SYSROOT" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=14 -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DOGRE_BUILD_PLATFORM_APPLE_IOS=TRUE \
            2>&1 | tee logs/ois-configure.log

      - name: Build + install OIS
        continue-on-error: true
        run: |
          cmake --build ois/build -j $(sysctl -n hw.ncpu) 2>&1 | tee logs/ois-build.log
          mkdir -p "$IOS_PREFIX/lib" "$IOS_PREFIX/include/OIS"
          cp ois/build/libOIS.a "$IOS_PREFIX/lib/" 2>/dev/null || \
            find ois/build -name 'libOIS*.a' -exec cp {} "$IOS_PREFIX/lib/" \;
          # RoR includes flat <OIS.h>, so the headers must sit directly in
          # the directory we hand to ROR_OIS_INCLUDE_DIR.
          hdr=$(find ois -name 'OIS.h' -not -path '*/build/*' | head -1)
          if [ -n "$hdr" ]; then cp "$(dirname "$hdr")"/*.h "$IOS_PREFIX/include/OIS/"; fi
          echo "----- OIS lib -----"
          ls -la "$IOS_PREFIX/lib/libOIS.a" || true
          echo "----- OIS headers -----"
          ls "$IOS_PREFIX/include/OIS" | head -20 || true
          lipo -info "$IOS_PREFIX/lib/libOIS.a" 2>/dev/null || true

      # ---------------------------------------------------------------- #
      # fmt (RoR links fmt::fmt)                                          #
      # ---------------------------------------------------------------- #
      - name: Get fmt 12.2.0
        continue-on-error: true
        run: |
          git clone --depth 1 --branch 12.2.0 https://github.com/fmtlib/fmt.git fmt

      - name: Configure fmt (iOS, static, Makefiles)
        continue-on-error: true
        run: |
          cmake -S fmt -B fmt/build -G "Unix Makefiles" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_DEPLOYMENT_TARGET \
            -DCMAKE_OSX_SYSROOT="$IOS_SYSROOT" \
            -DCMAKE_INSTALL_PREFIX="$IOS_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_CXX_STANDARD=14 -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DFMT_TEST=OFF -DFMT_DOC=OFF -DFMT_INSTALL=ON \
            2>&1 | tee logs/fmt-configure.log

      - name: Build + install fmt
        continue-on-error: true
        run: |
          cmake --build fmt/build -j $(sysctl -n hw.ncpu) 2>&1 | tee logs/fmt-build.log
          cmake --build fmt/build --target install 2>&1 | tee logs/fmt-install.log
          find "$IOS_PREFIX" -name 'libfmt*' | head -10
          find "$IOS_PREFIX" -name 'fmt-config.cmake' -o -name 'fmtConfig.cmake' | head -10

      # ---------------------------------------------------------------- #
      # RapidJSON (header-only; RoR reads RapidJSON_INCLUDE_DIRS)         #
      # ---------------------------------------------------------------- #
      - name: Get RapidJSON
        continue-on-error: true
        run: |
          git clone --depth 1 --branch v1.1.0 https://github.com/Tencent/rapidjson.git rapidjson

      - name: Install RapidJSON + synthesize RapidJSONConfig.cmake
        continue-on-error: true
        run: |
          mkdir -p "$IOS_PREFIX/include" "$IOS_PREFIX/lib/cmake/RapidJSON"
          cp -R rapidjson/include/rapidjson "$IOS_PREFIX/include/"
          cat > "$IOS_PREFIX/lib/cmake/RapidJSON/RapidJSONConfig.cmake" <<'EOF'
          get_filename_component(_prefix "${CMAKE_CURRENT_LIST_DIR}/../../.." ABSOLUTE)
          set(RapidJSON_INCLUDE_DIRS "${_prefix}/include")
          set(RapidJSON_INCLUDE_DIR  "${_prefix}/include")
          set(RapidJSON_FOUND TRUE)
          EOF
          ls "$IOS_PREFIX/include/rapidjson" | head -5

      # ---------------------------------------------------------------- #
      # SocketW (RoR's master-server / multiplayer TCP layer).            #
      # OpenSSL is intentionally NOT built: SocketW's find_package(OpenSSL)#
      # is optional and RoR's protocol is plain TCP.  We disable the      #
      # search so a homebrew OpenSSL cannot leak into the SDK.            #
      # ---------------------------------------------------------------- #
      - name: Get SocketW
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/AnotherFoxGuy/SocketW.git socketw

      - name: Configure SocketW (iOS, static, no OpenSSL)
        continue-on-error: true
        run: |
          cmake -S socketw -B socketw/build -G "Unix Makefiles" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_DEPLOYMENT_TARGET \
            -DCMAKE_OSX_SYSROOT="$IOS_SYSROOT" \
            -DCMAKE_INSTALL_PREFIX="$IOS_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_CXX_STANDARD=14 -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE \
            2>&1 | tee logs/socketw-configure.log

      - name: Build + install SocketW
        continue-on-error: true
        run: |
          cmake --build socketw/build -j $(sysctl -n hw.ncpu) 2>&1 | tee logs/socketw-build.log
          cmake --build socketw/build --target install 2>&1 | tee logs/socketw-install.log
          find "$IOS_PREFIX" -name 'libSocketW*' | head -10
          find "$IOS_PREFIX" -name 'SocketW*.cmake' | head -10

      # ---------------------------------------------------------------- #
      # AngelScript (2.38) - provides Angelscript::angelscript              #
      # ---------------------------------------------------------------- #
      - name: Get AngelScript 2.38.0
        continue-on-error: true
        run: |
          git clone --depth 1 --branch v2.38.0 https://github.com/anjo76/angelscript.git angelscript

      - name: Patch AngelScript for iOS/arm64 arch detection
        continue-on-error: true
        run: |
          f=angelscript/sdk/angelscript/projects/cmake/CMakeLists.txt
          python3 - "$f" <<'PY'
          import sys
          p = sys.argv[1]
          d = open(p, "r", encoding="utf-8", errors="replace").read()

          old = 'set(ARCHFLAGS "${CMAKE_SYSTEM_PROCESSOR}")\n' \
                'if (APPLE AND NOT IOS)\n' \
                '  if (${CMAKE_SYSTEM_PROCESSOR} MATCHES "arm")\n' \
                '    set(ARCHFLAGS "aarch64")\n' \
                '  endif ()\n' \
                'endif ()\n'

          new = 'set(ARCHFLAGS "${CMAKE_SYSTEM_PROCESSOR}")\n' \
                '# Apple/iOS port: CMAKE_SYSTEM_PROCESSOR is NOT the target CPU for an\n' \
                '# Apple cross-compile - CMake leaves it at the host value, so an\n' \
                '# iphoneos/arm64 build can report x86_64 here.  That silently skipped\n' \
                '# both the "^arm" and the "^aarch64" branches further down, so none of\n' \
                '# the as_callfunc_arm64 sources were compiled and link failed with\n' \
                '# "CallSystemFunctionNative", undefined, referenced from\n' \
                '# CallSystemFunction() in as_callfunc.cpp.o.  Derive the target CPU\n' \
                '# from CMAKE_OSX_ARCHITECTURES, which this port does set.\n' \
                'if (APPLE)\n' \
                '  if (CMAKE_OSX_ARCHITECTURES MATCHES "arm64" OR CMAKE_OSX_ARCHITECTURES MATCHES "aarch64")\n' \
                '    set(ARCHFLAGS "aarch64")\n' \
                '  elseif (CMAKE_SYSTEM_PROCESSOR MATCHES "arm")\n' \
                '    set(ARCHFLAGS "aarch64")\n' \
                '  endif ()\n' \
                'endif ()\n' \
                'message(STATUS "Apple/iOS port: ARCHFLAGS=${ARCHFLAGS} "\n' \
                '               "(CMAKE_SYSTEM_PROCESSOR=${CMAKE_SYSTEM_PROCESSOR} "\n' \
                '               "CMAKE_OSX_ARCHITECTURES=${CMAKE_OSX_ARCHITECTURES})")\n'

          assert old in d, "ARCHFLAGS anchor missing"
          d = d.replace(old, new, 1)
          open(p, "w", encoding="utf-8").write(d)
          print("patched")
          PY
          sed -n '24,46p' "$f"

      - name: Configure AngelScript (iOS, static, Makefiles)
        continue-on-error: true
        run: |
          cmake -S angelscript/sdk/angelscript/projects/cmake -B angelscript/build -G "Unix Makefiles" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_DEPLOYMENT_TARGET \
            -DCMAKE_OSX_SYSROOT="$IOS_SYSROOT" \
            -DCMAKE_INSTALL_PREFIX="$IOS_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            2>&1 | tee logs/as-configure.log

      - name: Build + install AngelScript
        continue-on-error: true
        run: |
          cmake --build angelscript/build -j $(sysctl -n hw.ncpu) 2>&1 | tee logs/as-build.log
          cmake --build angelscript/build --target install 2>&1 | tee logs/as-install.log
          find "$IOS_PREFIX" -name 'libangelscript*' | head -10

      # ---------------------------------------------------------------- #
      # openal-soft (1.24.3)                                              #
      # ---------------------------------------------------------------- #
      - name: Get openal-soft
        continue-on-error: true
        run: |
          git clone --depth 1 --branch 1.24.3 https://github.com/kcat/openal-soft.git openal-soft

      - name: Configure openal-soft (iOS, static, Makefiles)
        continue-on-error: true
        run: |
          cmake -S openal-soft -B openal-soft/build -G "Unix Makefiles" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_DEPLOYMENT_TARGET \
            -DCMAKE_OSX_SYSROOT="$IOS_SYSROOT" \
            -DCMAKE_INSTALL_PREFIX="$IOS_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBTYPE=STATIC \
            -DALSOFT_EXAMPLES=OFF -DALSOFT_UTILS=OFF -DALSOFT_TESTS=OFF \
            2>&1 | tee logs/oa-configure.log

      - name: Build + install openal-soft
        continue-on-error: true
        run: |
          cmake --build openal-soft/build -j $(sysctl -n hw.ncpu) 2>&1 | tee logs/oa-build.log
          cmake --build openal-soft/build --target install 2>&1 | tee logs/oa-install.log
          find "$IOS_PREFIX" -name 'libopenal*' | head -10

      # ---------------------------------------------------------------- #
      # MyGUI 3.4.0 (+ synthesized MyGUI:: namespaced config)              #
      # ---------------------------------------------------------------- #
      - name: Get MyGUI 3.4.0
        continue-on-error: true
        run: |
          git clone --depth 1 --branch MyGUI3.4.0 https://github.com/MyGUI/mygui.git mygui

      - name: Patch MyGUI for iOS (no Carbon/Cocoa, stable archive names)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          # 1) On iOS, APPLE is TRUE but there is no Carbon/Cocoa framework and
          #    no host /usr/include.  MyGUI's `if (APPLE)` blocks add all three:
          #      CMake/Dependencies.cmake      -> makes Carbon+Cocoa REQUIRED
          #      MyGUIEngine/CMakeLists.txt    -> link Carbon, -I/usr/include
          #      OgrePlatform/CMakeLists.txt   -> link Carbon, -I/usr/include
          #    It only needs Carbon for the macOS input layer, which iOS does
          #    not use at all, so every such guard is made iOS-aware.
          #
          # 2) With MYGUI_STATIC=TRUE MyGUI renames its archives to *Static
          #    (MyGUIConfigTargets.cmake: `OUTPUT_NAME ${PROJECTNAME}Static`),
          #    i.e. libMyGUIEngineStatic.a.  RoR's own cmake/find-modules/
          #    FindMyGUI.cmake looks for "MyGUIEngine" and "MyGUI.OgrePlatform"
          #    (no suffix), so we drop the rename to get libMyGUIEngine.a and
          #    libMyGUI.OgrePlatform.a.
          guard_files = [
              "mygui/CMake/Dependencies.cmake",
              "mygui/MyGUIEngine/CMakeLists.txt",
              "mygui/Platforms/Ogre/OgrePlatform/CMakeLists.txt",
          ]
          ios_guard = 'if (APPLE AND NOT CMAKE_SYSTEM_NAME STREQUAL "iOS")'
          for p in guard_files:
              d = open(p, "r", encoding="utf-8", errors="replace").read()
              n = d.count("if (APPLE)")
              assert n, "no `if (APPLE)` found in %s" % p
              open(p, "w", encoding="utf-8").write(d.replace("if (APPLE)", ios_guard))
              print("patched %d APPLE guard(s) in %s" % (n, p))

          p = "mygui/CMake/Utils/MyGUIConfigTargets.cmake"
          d = open(p, "r", encoding="utf-8", errors="replace").read()
          assert "OUTPUT_NAME ${PROJECTNAME}Static" in d, "Static OUTPUT_NAME anchor missing"
          d = d.replace("OUTPUT_NAME ${PROJECTNAME}Static", "OUTPUT_NAME ${PROJECTNAME}")
          open(p, "w", encoding="utf-8").write(d)
          print("patched archive OUTPUT_NAME in %s" % p)
          PY
          grep -rn "CMAKE_SYSTEM_NAME STREQUAL" \
            mygui/CMake/Dependencies.cmake \
            mygui/MyGUIEngine/CMakeLists.txt \
            mygui/Platforms/Ogre/OgrePlatform/CMakeLists.txt
          grep -n "OUTPUT_NAME" mygui/CMake/Utils/MyGUIConfigTargets.cmake

      - name: Configure MyGUI (iOS, static, Ogre + freetype)
        continue-on-error: true
        run: |
          # MyGUI ships its own CMake/Packages/FindFreetype.cmake which looks at
          # FREETYPE_INCLUDE_DIR / FREETYPE_FT2BUILD_INCLUDE_DIR / *_LIBRARY_REL
          # (NOT the modern FREETYPE_LIBRARY / FREETYPE_INCLUDE_DIRS names that
          # were passed before - that is why it "Could not locate FREETYPE" and
          # then fell back to homebrew's macOS freetype via pkg-config).
          cmake -S mygui -B mygui/build -G "Unix Makefiles" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_DEPLOYMENT_TARGET \
            -DCMAKE_OSX_SYSROOT="$IOS_SYSROOT" \
            -DCMAKE_INSTALL_PREFIX="$IOS_PREFIX" \
            -DCMAKE_PREFIX_PATH="$IOS_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=14 -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DMYGUI_RENDERSYSTEM=3 \
            -DMYGUI_STATIC=TRUE \
            -DMYGUI_USE_FREETYPE=TRUE \
            -DMYGUI_BUILD_DEMOS=FALSE -DMYGUI_BUILD_TOOLS=FALSE -DMYGUI_BUILD_UNITTESTS=FALSE \
            -DMYGUI_BUILD_PLUGINS=FALSE -DMYGUI_DISABLE_PLUGINS=TRUE \
            -DMYGUI_INSTALL_MEDIA=FALSE \
            -DFREETYPE_INCLUDE_DIR="$IOS_PREFIX/include/freetype2" \
            -DFREETYPE_FT2BUILD_INCLUDE_DIR="$IOS_PREFIX/include/freetype2" \
            -DFREETYPE_LIBRARY_REL="$IOS_PREFIX/lib/libfreetype.a" \
            -DZLIB_LIBRARY="$IOS_SYSROOT/usr/lib/libz.tbd" \
            -DZLIB_INCLUDE_DIR="$IOS_SYSROOT/usr/include" \
            -DOGRE_INCLUDE_DIR="$IOS_PREFIX/include/OGRE" \
            -DOGRE_LIBRARIES="OgreMain;OgreOverlay" \
            -DOGRE_LIB_DIR="$IOS_PREFIX/lib/Release" \
            2>&1 | tee logs/mygui-configure.log

      - name: Build + install MyGUI
        continue-on-error: true
        run: |
          cmake --build mygui/build -j $(sysctl -n hw.ncpu) 2>&1 | tee logs/mygui-build.log
          cmake --build mygui/build --target install 2>&1 | tee logs/mygui-install.log
          # Belt and braces: if the OUTPUT_NAME patch above ever fails to apply,
          # MyGUI would install libMyGUIEngineStatic.a / libMyGUI.OgrePlatformStatic.a.
          # RoR's FindMyGUI.cmake only looks for the unsuffixed names, so copy
          # them across under the canonical name as well.
          for pair in "MyGUIEngine:MyGUIEngineStatic" "MyGUI.OgrePlatform:MyGUI.OgrePlatformStatic"; do
            want="${pair%%:*}"; have="${pair##*:}"
            if [ ! -f "$IOS_PREFIX/lib/lib${want}.a" ] && [ -f "$IOS_PREFIX/lib/lib${have}.a" ]; then
              echo "renaming lib${have}.a -> lib${want}.a"
              cp "$IOS_PREFIX/lib/lib${have}.a" "$IOS_PREFIX/lib/lib${want}.a"
            fi
          done
          find "$IOS_PREFIX" -name 'libMyGUI*' | head -10

      # ---------------------------------------------------------------- #
      # PagedGeometry 1.2.0 - provides PagedGeometry::PagedGeometry       #
      #                                                                   #
      # Its 2009-era build system only speaks pkg-config for OGRE and is  #
      # wrong for iOS (OGRE.pc hardcodes X11/freeimage/boost and          #
      # libdir=lib while the real libs are in lib/Release).  The library  #
      # is just 12 translation units needing OGRE headers, so we replace  #
      # the dependency probe with a no-op and pass the paths explicitly.  #
      # RoR's own FindPagedGeometry.cmake then picks up                    #
      # <prefix>/include/PagedGeometry/PagedGeometry.h and                #
      # <prefix>/lib/libPagedGeometry.a - exactly where it installs.      #
      # ---------------------------------------------------------------- #
      - name: Get PagedGeometry 1.2.0
        continue-on-error: true
        run: |
          git clone --depth 1 --branch v1.2.0 \
            https://github.com/AnotherFoxGuy/ogre-pagedgeometry.git pagedgeometry

      - name: Configure + build + install PagedGeometry (iOS)
        continue-on-error: true
        run: |
          printf '%s\n' \
            '# iOS port: no pkg-config. OGRE paths are supplied with -D on the' \
            '# cmake command line (see build-ios-deps.yml).' \
            > pagedgeometry/CMakeDependenciesConfig.txt

          # v1.2.0 is from 2009 and its sources are written against the classic
          # "one big Ogre.h" include style.  GrassLoader.cpp dereferences
          # Material::getTechnique()->getPass() and uses Ogre::SceneNode without
          # including OgreTechnique.h / OgreSceneNode.h, so on OGRE 1.11 it dies
          # with "member access into incomplete type".  Ogre.h only pulls in
          # OgreMain headers, so prepending it to every translation unit fixes
          # that whole family of errors at once.
          for f in pagedgeometry/source/*.cpp; do
            if grep -q 'Ogre\.h' "$f"; then continue; fi
            awk 'BEGIN { print "#include <Ogre.h>" } { print }' "$f" > "$f.new"
            mv "$f.new" "$f"
            echo "prepended <Ogre.h> to $f"
          done

          cmake -S pagedgeometry -B pagedgeometry/build -G "Unix Makefiles" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_DEPLOYMENT_TARGET \
            -DCMAKE_OSX_SYSROOT="$IOS_SYSROOT" \
            -DCMAKE_INSTALL_PREFIX="$IOS_PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_CXX_STANDARD=14 -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DPAGEDGEOMETRY_BUILD_SAMPLES=FALSE \
            -DOgre_INCLUDE_DIRS="$IOS_PREFIX/include/OGRE" \
            -DOgre_LIBRARY_DIRS="$IOS_PREFIX/lib/Release" \
            -DOgre_LIBRARIES="OgreMain" \
            2>&1 | tee logs/paged-configure.log

          # -k (keep going) on purpose: one broken file must not hide the rest.
          # The whole point of this workflow is to see every error in one run.
          make -C pagedgeometry/build -k -j "$(sysctl -n hw.ncpu)" \
            2>&1 | tee logs/paged-build.log || true

          echo "----- PagedGeometry compile errors -----"
          grep -E 'error:' logs/paged-build.log | head -40 || echo "(none)"
          {
            echo "### PagedGeometry compile errors"
            echo '```'
            grep -E 'error:' logs/paged-build.log | head -40 || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # The project sets the legacy LIBRARY_OUTPUT_PATH variable to
          # <srcdir>/lib, so the archive does NOT land under build/ - search the
          # whole tree.  (Unprefixed ARCHIVE_OUTPUT_DIRECTORY is ignored by CMake,
          # but LIBRARY_OUTPUT_PATH is honoured for library targets.)
          lib="$(find pagedgeometry -name 'libPagedGeometry.a' -print -quit)"
          if [ -n "$lib" ]; then
            echo "built $lib"
            cmake --build pagedgeometry/build --target install 2>&1 | tee logs/paged-install.log || true

            # Belt and braces: the install rules cover both the source headers
            # and the generated PagedGeometryConfig.h, but if anything about
            # them goes wrong, copy the pieces where RoR's FindPagedGeometry
            # expects them (<prefix>/lib + <prefix>/include/PagedGeometry).
            mkdir -p "$IOS_PREFIX/lib" "$IOS_PREFIX/include/PagedGeometry"
            cp -f "$lib" "$IOS_PREFIX/lib/libPagedGeometry.a"
            cp -f pagedgeometry/include/*.h "$IOS_PREFIX/include/PagedGeometry/" 2>/dev/null || true
            cp -f pagedgeometry/build/include/*.h "$IOS_PREFIX/include/PagedGeometry/" 2>/dev/null || true
          else
            echo "libPagedGeometry.a was NOT produced"
          fi
          find "$IOS_PREFIX" -name 'libPagedGeometry*' | head -10
          ls "$IOS_PREFIX/include/PagedGeometry" 2>/dev/null | head -20 || true

      - name: "Normalize MyGUI cmake package (MyGUI:: namespaced targets)"
        if: always()
        continue-on-error: true
        run: |
          # MyGUI installs its own CMake/Templates/MYGUIConfig.cmake which only
          # sets the classic variables (MYGUI_LIBRARIES="MyGUIEngine") and knows
          # nothing about MyGUI::MyGUI / MyGUI::OgrePlatform that RoR links.
          # Remove whatever MyGUI installed and drop in our namespaced config so
          # the result is correct regardless of whether CMake prefers module or
          # config mode (RoR also ships its own FindMyGUI.cmake).
          rm -rf "$IOS_PREFIX/lib/cmake/MyGUI" "$IOS_PREFIX/lib/MYGUI" "$IOS_PREFIX/lib/MyGUI"
          find "$IOS_PREFIX" -name 'MYGUIConfig.cmake' -o -name 'MyGUIConfig.cmake' | while read -r f; do rm -f "$f"; done
          mkdir -p "$IOS_PREFIX/lib/cmake/MyGUI"
          cat > "$IOS_PREFIX/lib/cmake/MyGUI/MyGUIConfig.cmake" <<'EOF'
          get_filename_component(_prefix "${CMAKE_CURRENT_LIST_DIR}/../../.." ABSOLUTE)
          set(MyGUI_INCLUDE_DIRS "${_prefix}/include/MYGUI")
          set(MyGUI_LIBRARY_DIRS "${_prefix}/lib")
          set(MYGUI_INCLUDE_DIRS "${_prefix}/include/MYGUI")

          if(NOT TARGET MyGUI::MyGUI)
            add_library(MyGUI::MyGUI STATIC IMPORTED)
            set_target_properties(MyGUI::MyGUI PROPERTIES
              IMPORTED_LOCATION "${_prefix}/lib/libMyGUIEngine.a"
              INTERFACE_INCLUDE_DIRECTORIES "${_prefix}/include/MYGUI")
          endif()

          if(NOT TARGET MyGUI::OgrePlatform)
            add_library(MyGUI::OgrePlatform STATIC IMPORTED)
            set_target_properties(MyGUI::OgrePlatform PROPERTIES
              IMPORTED_LOCATION "${_prefix}/lib/libMyGUI.OgrePlatform.a"
              INTERFACE_INCLUDE_DIRECTORIES "${_prefix}/include/MYGUI")
          endif()

          set(MyGUI_FOUND TRUE)
          EOF
          cat "$IOS_PREFIX/lib/cmake/MyGUI/MyGUIConfig.cmake"

      - name: Verify full iOS SDK
        if: always()
        run: |
          echo "----- SDK summary -----"
          find "$IOS_PREFIX" -name '*.a' | sort
          echo "----- check required libs -----"
          missing=0
          for lib in OgreMain OgreGLSupport OgreBites OgreOverlay OgrePaging OgreTerrain OgreRTShaderSystem OgreMeshLodGenerator; do
            if ! find "$IOS_PREFIX" -name "lib${lib}Static.a" | grep -q .; then echo "MISSING OGRE lib: $lib"; missing=1; fi
          done
          for lib in RenderSystem_GLES2 Plugin_OctreeSceneManager Plugin_ParticleFX Codec_STBI; do
            if ! find "$IOS_PREFIX" -name "lib${lib}Static.a" | grep -q .; then echo "MISSING OGRE plugin: $lib"; missing=1; fi
          done
          [ -f "$IOS_PREFIX/lib/libfreetype.a" ]             || { echo "MISSING: libfreetype.a"; missing=1; }
          [ -f "$IOS_PREFIX/lib/libOIS.a" ]                  || { echo "MISSING: libOIS.a"; missing=1; }
          [ -f "$IOS_PREFIX/include/OIS/OIS.h" ]             || { echo "MISSING: OIS.h"; missing=1; }
          find "$IOS_PREFIX" -name 'libangelscript*'         | grep -q . || { echo "MISSING: angelscript lib"; missing=1; }
          # A file existing is not enough - the first link attempt failed on
          # "CallSystemFunctionNative", undefined, referenced from
          # CallSystemFunction() in as_callfunc.cpp.o, because the arm64
          # as_callfunc sources had not been compiled into the archive at all.
          mkdir -p logs
          nm -g "$IOS_PREFIX/lib/libangelscript.a" > logs/angelscript.nm 2>/dev/null || true
          if grep "CallSystemFunctionNative" logs/angelscript.nm | grep -qE "^[0-9a-f]+ [TtDdWwSsXB] "; then
            echo "  ok      libangelscript.a defines CallSystemFunctionNative (arm64 native callfunc present)"
          else
            echo "MISSING: libangelscript.a does NOT define CallSystemFunctionNative - the ARCHFLAGS patch did not select the arm64 sources"
            grep -c . logs/angelscript.nm || true
            missing=1
          fi
          find "$IOS_PREFIX" -name 'libopenal*'              | grep -q . || { echo "MISSING: openal-soft lib"; missing=1; }
          find "$IOS_PREFIX" -name 'libMyGUIEngine*'         | grep -q . || { echo "MISSING: MyGUIEngine lib"; missing=1; }
          find "$IOS_PREFIX" -name 'libMyGUI.OgrePlatform*'  | grep -q . || { echo "MISSING: MyGUI.OgrePlatform lib"; missing=1; }
          find "$IOS_PREFIX" -name 'libfmt*'                 | grep -q . || { echo "MISSING: fmt lib"; missing=1; }
          [ -d "$IOS_PREFIX/include/rapidjson" ]             || { echo "MISSING: rapidjson headers"; missing=1; }
          find "$IOS_PREFIX" -name 'libSocketW*'             | grep -q . || { echo "MISSING: SocketW lib"; missing=1; }
          find "$IOS_PREFIX" -name 'libPagedGeometry*'       | grep -q . || { echo "MISSING: PagedGeometry lib"; missing=1; }
          [ -f "$IOS_PREFIX/include/PagedGeometry/PagedGeometry.h" ] || { echo "MISSING: PagedGeometry.h"; missing=1; }
          # Zip archive support is what every RoR resource pack needs.  A
          # missing zziplib is invisible until the app dies on device in
          # SetUpConfigSkeleton(), so gate the SDK artifact on it here.
          [ -f "$IOS_PREFIX/lib/libzzip.a" ]                 || { echo "MISSING: libzzip.a"; missing=1; }
          [ -f "$IOS_PREFIX/include/zzip/zzip.h" ]           || { echo "MISSING: zzip/zzip.h"; missing=1; }
          grep -q '#define OGRE_NO_ZIP_ARCHIVE 0' "$IOS_PREFIX/include/OGRE/OgreBuildSettings.h" \
            || { echo "MISSING: OGRE was built without Zip archive support (OGRE_NO_ZIP_ARCHIVE is not 0)"; missing=1; }
          strings "$IOS_PREFIX/lib/Release/libOgreMainStatic.a" 2>/dev/null \
            | grep -q 'Modification of zipped archives is not supported' \
            || { echo "MISSING: libOgreMainStatic.a has no OgreZip.cpp objects"; missing=1; }
          echo "----- cmake package files RoR will look for -----"
          for f in "$IOS_PREFIX/CMake/OGREConfig.cmake" \
                   "$IOS_PREFIX/lib/cmake/Angelscript/AngelscriptConfig.cmake" \
                   "$IOS_PREFIX/lib/cmake/SocketW/SocketWConfig.cmake" \
                   "$IOS_PREFIX/lib/cmake/RapidJSON/RapidJSONConfig.cmake" \
                   "$IOS_PREFIX/lib/cmake/MyGUI/MyGUIConfig.cmake"; do
            if [ -f "$f" ]; then echo "  ok      $f"; else echo "  MISSING $f"; missing=1; fi
          done
          find "$IOS_PREFIX" -name 'fmt-config.cmake' -o -name 'fmtConfig.cmake' | head -5
          if [ "$missing" -eq 1 ]; then echo "SDK VERIFICATION FAILED"; exit 1; fi
          echo "SDK VERIFICATION PASSED"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogre-ios-sdk-logs
          path: logs/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload iOS SDK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sdk
          path: ios-sdk/
          retention-days: 14
          if-no-files-found: warn
