name: Build my IPA

# Builds an unsigned .ipa on a free macOS runner. Public repositories get free
# macOS Actions minutes, which is why this repository is meant to stay public
# (Rigs of Rods is GPLv3 anyway, so there is nothing to hide).

on:
  workflow_dispatch:
    inputs:
      paid_account:
        description: "I have a paid Apple developer account (ask for the extra-memory entitlements)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen

      - name: Build the IPA
        run: bash build_ipa.sh ${{ inputs.paid_account && '--paid' || '' }}

      - name: Upload the IPA as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoRNative-ipa
          path: RoRNative.ipa
          retention-days: 7

      - name: Publish the IPA as a release (easiest to download on a phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Smoke test only - this is NOT the game.  It is republished on every
          # push to main, so it must not share a tag with the real RoR IPA
          # (build-ror-ios.yml owns `latest-ipa`); otherwise whichever run
          # finished last would decide what the download link contains.
          gh release delete pipeline-check --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          # --prerelease matters: GitHub picks the most recent non-prerelease as
          # "Latest", and releases/latest is the link people are told to use.
          # Without this flag a smoke-test run pushed after the game build would
          # take that link over and hand visitors the Hello-World app.
          gh release create pipeline-check RoRNative.ipa \
            --repo "${{ github.repository }}" \
            --prerelease \
            --title "Pipeline smoke test - NOT the game (built $(date -u +%Y-%m-%d))" \
            --notes "This is a Hello-World iOS app.  It exists only to prove the build-and-package pipeline works end to end on a free macOS runner.  **The game itself is in the latest-ipa release.**"
