name: Build RoR for iOS (consumes the dependency SDK)

# Milestone 9.
#
# build-ios-deps.yml produces exactly one prefix (ios-sdk) holding every
# third-party library RoR needs for iphoneos/arm64.  This workflow downloads
# that artifact, applies patches/ror/apply_ios_patches.py to a fresh Rigs of
# Rods checkout, and then configures + builds RoR itself against it.
#
# The point of this run is NOT yet to produce a working app.  It is to get the
# complete list of places where RoR's own C++ does not compile for iOS/touch,
# so the build runs `make -k` (keep going) and the summary collects every
# `error:` line into the step summary.  Link errors are expected and ignored.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish to (default latest-ipa)"
        required: false
        default: latest-ipa
      deps_run_id:
        description: "Pin a specific build-ios-deps run ID to consume (blank = newest successful run)"
        required: false
        default: ""
  push:
    branches: [probe]

permissions:
  # contents: write so the packaging step can attach the finished IPA to the
  # rolling `ios-alpha` release (a plain .ipa download link, which is a lot
  # harder to get wrong than the zipped Actions artifact).
  contents: write
  actions: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || 'latest-ipa' }}
  # Must match build-ios-deps.yml: every static library in the SDK carries this
  # minimum, and the linker warns when the app claims an older one.
  # 13.0 rather than 16.0 so the IPA installs on every arm64 iPhone (6s and
  # newer) instead of refusing on anything below iOS 16.
  IOS_DEPLOYMENT_TARGET: "13.0"
  ROR_REPO: https://github.com/RigsOfRods/rigs-of-rods.git
  # Pinned on purpose: patches/ror/apply_ios_patches.py matches upstream text
  # verbatim, so tracking the moving default branch would make the port
  # unreproducible (and silently break the patch step instead of the build).
  ROR_COMMIT: d426a5c5e9f76a77a34e5fba8a41cda20edbe97f

jobs:
  ror-ios:
    name: Configure + build RoR for iphoneos/arm64
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Locate the iOS sysroot
        run: |
          mkdir -p logs
          echo "IOS_SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV

      # ------------------------------------------------------------------ #
      # The dependency SDK comes from the last completed build-ios-deps run. #
      # Its artifact is uploaded with `if: always()`, so we can use it even  #
      # when the verification step of that run failed.                       #
      # ------------------------------------------------------------------ #
      - name: Download the iOS dependency SDK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.deps_run_id }}" ]; then
            RUN_ID="${{ inputs.deps_run_id }}"
            echo "using pinned ios-sdk from dependency run $RUN_ID"
          else
            RUN_ID=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/build-ios-deps.yml/runs?per_page=20" \
              --jq '[.workflow_runs[] | select(.status=="completed" and .conclusion=="success")][0].id')
            echo "using ios-sdk from newest successful dependency run $RUN_ID"
          fi
          echo "DEPS_RUN_ID=$RUN_ID" >> $GITHUB_ENV
          mkdir -p sdk
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n ios-sdk -D sdk
          echo "----- downloaded tree (depth 2) -----"
          find sdk -maxdepth 2 | head -40

      - name: Normalize the downloaded SDK
        run: |
          set -euo pipefail

          # `gh run download -n` may or may not nest the artifact in a directory
          # named after itself.  OGREConfig.cmake must live in <prefix>/CMake for
          # its PACKAGE_PREFIX_DIR (= CMAKE_CURRENT_LIST_DIR/..) to resolve, so
          # use it as the anchor.
          OGRE_CFG="$(find "$GITHUB_WORKSPACE/sdk" -name OGREConfig.cmake -print -quit)"
          [ -n "$OGRE_CFG" ] || { echo "OGREConfig.cmake not found in the artifact"; exit 1; }
          PREFIX="$(cd "$(dirname "$(dirname "$OGRE_CFG")")" && pwd)"
          echo "OGRE config : $OGRE_CFG"
          echo "IOS_PREFIX=$PREFIX" >> $GITHUB_ENV
          echo "prefix      : $PREFIX"

          # 1) OgreTargets.cmake records the absolute path of the FreeType
          #    archive of the machine that *built* OGRE.  Re-point it here.
          #    (sed's # delimiter because the replacement contains /.)
          find "$PREFIX" -name '*.cmake' \
            -exec sed -i '' "s#/Users/runner/work/ror-ios/ror-ios/ios-sdk#$PREFIX#g" {} +

          # 2) ... and it records a `ZLIB::ZLIB` link dependency which
          #    OGREConfig.cmake never re-creates for consumers, so CMake would
          #    abort at generate time with "the target was not found".
          if ! grep -q 'CMakeFindDependencyMacro' "$OGRE_CFG"; then
            {
              echo ''
              echo '# iOS port: OgreTargets.cmake lists a ZLIB::ZLIB link dependency'
              echo '# (OGRE was built with zlib found), but the OGRE config never'
              echo '# re-creates that imported target for consumers.'
              echo 'include(CMakeFindDependencyMacro)'
              echo 'find_dependency(ZLIB)'
            } >> "$OGRE_CFG"
          fi

          # 3) OGRE_LIBRARIES mixes imported target names with one plain name
          #    (OgreGLSupportStatic, see OGREConfig.cmake) and OGRE_LIBRARY_DIRS
          #    does not contain lib/Release.  Copy the archives flat so that a
          #    plain `-L$IOS_PREFIX/lib` resolves everything.
          cp -f "$PREFIX"/lib/Release/*.a "$PREFIX/lib/" 2>/dev/null || true
          cp -f "$PREFIX"/lib/Release/OGRE/*.a "$PREFIX/lib/" 2>/dev/null || true
          echo "----- prefix/lib -----"
          ls "$PREFIX/lib" || true

      - name: Check the SDK really is complete
        run: |
          set -euo pipefail
          missing=0
          for f in "$IOS_PREFIX/CMake/OGREConfig.cmake" \
                   "$IOS_PREFIX/lib/libOIS.a" \
                   "$IOS_PREFIX/include/OIS/OIS.h" \
                   "$IOS_PREFIX/lib/libfreetype.a" \
                   "$IOS_PREFIX/include/MYGUI/MyGUI.h" \
                   "$IOS_PREFIX/include/rapidjson/document.h" \
                   "$IOS_PREFIX/include/PagedGeometry/PagedGeometry.h" \
                   "$IOS_PREFIX/lib/libzzip.a" \
                   "$IOS_PREFIX/include/zzip/zzip.h"; do
            if [ -e "$f" ]; then echo "  ok      $f"; else echo "  MISSING $f"; missing=1; fi
          done
          # OGRE's ZIP archive support comes from zziplib.  Without it OGRE has
          # no "Zip" archive factory at all, so every .zip resource location RoR
          # opens throws - the app died on device in
          # AppContext::SetUpConfigSkeleton() exactly there.  Refuse to build
          # against an SDK that predates the zziplib step.
          if grep -q '#define OGRE_NO_ZIP_ARCHIVE 0' "$IOS_PREFIX/include/OGRE/OgreBuildSettings.h" 2>/dev/null; then
            echo "  ok      OGRE was built with Zip archive support (zziplib)"
          else
            echo "  MISSING OGRE was built WITHOUT Zip archive support - re-run build-ios-deps.yml first"
            missing=1
          fi
          # The GLSL preprocessor fallback (blank terrain) is compiled into the
          # GLES2 render system - GLSLShaderCommon.cpp lives in
          # RenderSystems/GLSupport and links into RenderSystem_GLES2, not
          # OgreMain - so search every static lib rather than assuming which one
          # carries it.  rtss13 shipped an UNPATCHED OGRE because this workflow
          # consumed a stale dependency run - the binary still threw
          # "Failed to preprocess shader ... (line 132)" and the terrain stayed
          # blank.  Grep the downloaded libs for the patched fallback's marker
          # so a stale SDK fails loudly here instead of shipping a terrain-less
          # build.
          if grep -qra "compiling the raw source" "$IOS_PREFIX/lib"; then
            echo "  ok      the GLSL preprocessor fallback is present in the SDK's static libs"
          else
            echo "  MISSING the SDK's static libs lack the GLSL preprocessor fix - re-run build-ios-deps.yml and point this build at THAT run"
            missing=1
          fi
          for lib in MyGUIEngine MyGUI.OgrePlatform fmt SocketW PagedGeometry angelscript openal; do
            if find "$IOS_PREFIX" -name "lib${lib}*" | grep -q .; then
              echo "  ok      lib${lib}*"
            else
              echo "  MISSING lib${lib}*"; missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "::error::the dependency SDK is incomplete - check the build-ios-deps run"
            exit 1
          fi

      - name: Get RoR source
        run: |
          set -euo pipefail
          git init ror
          git -C ror remote add origin "$ROR_REPO"
          git -C ror fetch --depth 1 origin "$ROR_COMMIT"
          git -C ror checkout -q FETCH_HEAD
          git -C ror log -1 --format='RoR source: %H %ci %s'

          # The base content is a *submodule* (content -> RigsOfRods/content):
          # the Simple2 terrain and the two trucks.  Fetching the superproject
          # with --depth 1 does not touch it, and without it the game starts
          # with an empty terrain list - there is literally nothing to load,
          # so the port could not be tested past the main menu.
          #
          # `HEAD:content` is the commit the pinned RoR revision records, so
          # the content can never drift from the code it was tested with, and
          # the URL comes from .gitmodules rather than being spelled out here.
          #
          # Fetching a bare SHA works on GitHub (the superproject is fetched
          # exactly the same way a few lines up).  No history is needed: the
          # depth-1 fetch brings the commit and its whole tree, which is what
          # CMake zips.
          CONTENT_URL="$(git -C ror config -f .gitmodules --get submodule.content.url)"
          CONTENT_COMMIT="$(git -C ror rev-parse HEAD:content)"
          echo "content submodule: $CONTENT_URL @ $CONTENT_COMMIT"
          git init ror/content
          git -C ror/content fetch --depth 1 "$CONTENT_URL" "$CONTENT_COMMIT"
          git -C ror/content checkout -q FETCH_HEAD
          echo "----- content/ -----"
          ls -la ror/content
          find ror/content -name '*.terrn2' -o -name '*.truck' | sort

      - name: Patch RoR for the Apple/iOS port
        run: |
          python3 patches/ror/apply_ios_patches.py ror \
            --ois-include "$IOS_PREFIX/include/OIS" \
            --ois-lib "$IOS_PREFIX/lib/libOIS.a"
          echo "----- the OS_LIBS branch -----"
          sed -n '/set(OS_LIBS "Ws2_32")/,/^endif/p' ror/source/main/CMakeLists.txt | head -12

      - name: CMake configure (iOS)
        continue-on-error: true
        run: |
          # -G "Unix Makefiles" on purpose: RoR for iOS is a *static* C++
          #   cross-compile, the Xcode generator buys us nothing here, and make
          #   lets us run with -k to collect every error in one pass.
          # -DCMAKE_FIND_FRAMEWORK=LAST: never let a macOS system framework
          #   (there *is* a host OpenAL.framework) win over the iOS static libs.
          # -DOGRE_DIR: OGREConfig.cmake lives in <prefix>/CMake, which is not a
          #   standard search path.
          # -DCMAKE_FIND_ROOT_PATH_MODE_*: THE important ones.  For every
          #   Apple cross-compile, CMake's Modules/Platform/Darwin.cmake
          #   appends the SDK sysroot to CMAKE_FIND_ROOT_PATH and sets
          #   CMAKE_FIND_ROOT_PATH_MODE_{LIBRARY,INCLUDE,PACKAGE}=ONLY -
          #   but only `if (NOT DEFINED ...)`, so defining them here wins.
          #   Under ONLY, find_path/find_library/find_package look *solely*
          #   inside that root path (the iPhoneOS SDK), which makes
          #   $IOS_PREFIX completely invisible.  That is exactly why every
          #   dependency in the deps workflow had to be pinned by hand.
          #   BOTH lifts the restriction without the path-re-rooting
          #   surprises of adding the prefix to CMAKE_FIND_ROOT_PATH, and
          #   CMAKE_PREFIX_PATH is searched before the host's
          #   CMAKE_SYSTEM_PREFIX_PATH (homebrew), so the iOS libs win.
          # -DMyGUI_*/PagedGeometry_*/*_DIR: belt and braces.  MyGUI and
          #   PagedGeometry are looked up by RoR's own module-mode find
          #   modules (plain find_path/find_library), the rest are
          #   config-mode packages; presetting the cache entries makes them
          #   resolve deterministically instead of by search.
          # -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL: SocketW is built without
          #   OpenSSL, so a homebrew OpenSSL must not leak in.
          # -DCMAKE_EXE_LINKER_FLAGS: OGRE_LIBRARIES contains the plain name
          #   OgreGLSupportStatic, which needs -L to lib/Release.
          # -DZLIB_*: OGRE's Overlay component links ZLIB::ZLIB; pin it to the
          #   SDK's own zlib so a homebrew one cannot leak in.
          # -DOPENAL_*: same story for OpenAL (CMake's FindOpenAL would happily
          #   use the deprecated macOS OpenAL.framework).
          cmake -S ror -B ror/build -G "Unix Makefiles" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_DEPLOYMENT_TARGET \
            -DCMAKE_OSX_SYSROOT="$IOS_SYSROOT" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$IOS_PREFIX" \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DMyGUI_INCLUDE_DIR="$IOS_PREFIX/include/MYGUI" \
            -DMyGUI_MyGUIEngine_LIBRARY_REL="$IOS_PREFIX/lib/libMyGUIEngine.a" \
            -DMyGUI_OgrePlatform_LIBRARY_REL="$IOS_PREFIX/lib/libMyGUI.OgrePlatform.a" \
            -DPagedGeometry_INCLUDE_DIR="$IOS_PREFIX/include/PagedGeometry" \
            -DPagedGeometry_LIBRARY="$IOS_PREFIX/lib/libPagedGeometry.a" \
            -DAngelscript_DIR="$IOS_PREFIX/lib/cmake/Angelscript" \
            -Dfmt_DIR="$IOS_PREFIX/lib/cmake/fmt" \
            -DRapidJSON_DIR="$IOS_PREFIX/lib/cmake/RapidJSON" \
            -DSocketW_DIR="$IOS_PREFIX/lib/cmake/SocketW" \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE \
            -DCMAKE_FIND_FRAMEWORK=LAST \
            -DOGRE_DIR="$IOS_PREFIX/CMake" \
            -DZLIB_LIBRARY_RELEASE="$IOS_SYSROOT/usr/lib/libz.tbd" \
            -DZLIB_LIBRARY="$IOS_SYSROOT/usr/lib/libz.tbd" \
            -DZLIB_INCLUDE_DIR="$IOS_SYSROOT/usr/include" \
            -DOPENAL_LIBRARY="$IOS_PREFIX/lib/libopenal.a" \
            -DOPENAL_INCLUDE_DIR="$IOS_PREFIX/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$IOS_PREFIX/lib -L$IOS_PREFIX/lib/Release -L$IOS_PREFIX/lib/Release/OGRE" \
            -DROR_CREATE_CONTENT_FOLDER=ON \
            -DROR_OIS_INCLUDE_DIR="$IOS_PREFIX/include/OIS" \
            -DROR_OIS_LIBRARY="$IOS_PREFIX/lib/libOIS.a" \
            2>&1 | tee logs/ror-configure.log

          # Diagnostics: show what CMake actually resolved, so a failing
          # configure explains itself instead of needing another cycle.
          {
            echo "----- find-related CMakeCache entries -----"
            grep -E '^(CMAKE_FIND_ROOT_PATH|CMAKE_FIND_ROOT_PATH_MODE_|CMAKE_OSX_SYSROOT|CMAKE_SYSROOT|OGRE_DIR|MyGUI_|fmt_DIR|RapidJSON_DIR|SocketW_DIR|Angelscript_DIR|PagedGeometry_|ZLIB_)' ror/build/CMakeCache.txt 2>/dev/null || echo "(no CMakeCache.txt)"
          } | tee -a logs/ror-configure.log

      - name: Dump CMakeCache for diagnosis
        if: always()
        run: cp -f ror/build/CMakeCache.txt logs/CMakeCache.txt 2>/dev/null || true

      - name: Build with make -k (collect ALL errors)
        continue-on-error: true
        run: |
          make -C ror/build -k -j 4 2>&1 | tee logs/ror-build.log

      - name: Package RoR.app and IPA
        if: always()
        continue-on-error: true
        run: |
          set +e
          APP_DIR=ror/build/bin/RoR.app
          # Spelled once.  It is both the plist value and the identifier the
          # signature is told to use; if those two ever disagree the bundle is
          # not a valid iOS application (see the codesign note further down).
          BUNDLE_ID=org.rigsofrods.ror-ios
          if [ ! -f "$APP_DIR/RoR" ]; then
            echo "no linked binary at $APP_DIR/RoR - nothing to package"
            exit 0
          fi

          echo "----- linked binary -----"
          file "$APP_DIR/RoR"
          ls -la "$APP_DIR"

          # RoR resolves its data relative to the executable's parent directory
          # (AppContext::SetUpResourcesDir -> sys_process_dir), i.e. inside the
          # bundle, and SetUpConfigSkeleton() hard-requires
          # <resource dir>/skeleton.zip.  CMake's zip_folder_resources target
          # writes the zips to bin/resources, one level above the bundle.
          #
          # Inside the bundle that directory is called `rorres`, not
          # `resources`.  An .app carrying a top-level directory *named*
          # resources (or Resources - the check is case-insensitive) is refused
          # by the iOS installer with the generic "Unable to Install": codesign
          # flips its resource rules to the macOS "resource envelope" set
          # (rules=^Resources/, plus `^[^/]+$ -> nested` in rules2) the moment
          # such a directory appears, and iOS will not install a bundle sealed
          # that way.  Every other name - zzz/, Base.lproj/, rorres/ - keeps the
          # normal ^.* rules and installs.  apply_ios_patches.py renames the
          # directory in AppContext.cpp and ContentManager.cpp to match.
          # See PORT_FINDINGS.md section 7.22.
          if [ -d ror/build/bin/resources ]; then
            rm -rf "$APP_DIR/rorres"
            cp -R ror/build/bin/resources "$APP_DIR/rorres"
            echo "----- bundled resources (rorres/) -----"
            ls -la "$APP_DIR/rorres" | head -30
          else
            echo "WARNING: ror/build/bin/resources is missing - RoR will refuse to start"
          fi
          if [ -d ror/build/bin/content ]; then
            rm -rf "$APP_DIR/content"
            cp -R ror/build/bin/content "$APP_DIR/content"
            echo "----- bundled content (content/) -----"
            ls -la "$APP_DIR/content"
            # The terrain and vehicle files live *inside* these zips:
            # CacheSystem::ParseZipArchives() mounts every *.zip it finds in
            # RGN_CONTENT as a Zip resource location, which is what fills the
            # terrain list (ContentManager::ListAllUserContent).  A zip that
            # lost its .terrn2 is a hard failure in verify_ipa.py section 7;
            # these counts are here only to make the build log readable.
            for z in "$APP_DIR"/content/*.zip; do
              [ -e "$z" ] || continue
              n_terr="$(unzip -l "$z" 2>/dev/null | grep -c '\.terrn2' || true)"
              n_truck="$(unzip -l "$z" 2>/dev/null | grep -c '\.truck' || true)"
              echo "content zip: $(basename "$z") $(stat -f%z "$z") bytes (terrn2=$n_terr truck=$n_truck)"
            done
          else
            echo "::warning::ror/build/bin/content is missing - the app starts with no terrain and no vehicle"
          fi
          # plugins.cfg is deliberately NOT copied: on iOS the OGRE plugins are
          # static and registered through OgreBites::StaticPluginLoader, so RoR
          # never reads the file (SetUpRendering's iOS branch skips it).  It also
          # upset codesign, which reported it as an unsigned subcomponent.

          # CMake generated a macOS-style bundle plist from the default
          # template; an iOS bundle needs an iOS one.  printf rather than a
          # heredoc so nothing depends on indentation.
          #
          # The keys below mirror what xcodebuild writes for a real iOS app.
          # That matters for on-device signers (ESIGN and friends) and for
          # sideloaders, which read the plist before doing anything else:
          # CFBundleSupportedPlatforms is the key that marks a bundle as an
          # iOS application at all, and DTPlatformName/DTSDKName say which
          # SDK produced it.  The milestone-0 smoke-test bundle, built by
          # xcodebuild, carries all of them - matching it removes a whole
          # class of "this is not a valid .ipa" refusals.
          #
          # MinimumOSVersion is taken from IOS_DEPLOYMENT_TARGET instead of
          # being spelled out, so the plist and the binary's own LC_BUILD_VERSION
          # minimum can never drift apart.
          SDK_VER="$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo 18.5)"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '    <key>CFBundleDevelopmentRegion</key><string>en</string>' \
            '    <key>CFBundleExecutable</key><string>RoR</string>' \
            "    <key>CFBundleIdentifier</key><string>$BUNDLE_ID</string>" \
            '    <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>' \
            '    <key>CFBundleName</key><string>Rigs of Rods</string>' \
            '    <key>CFBundleDisplayName</key><string>Rigs of Rods</string>' \
            '    <key>CFBundlePackageType</key><string>APPL</string>' \
            '    <key>CFBundleShortVersionString</key><string>1.0</string>' \
            '    <key>CFBundleVersion</key><string>1</string>' \
            '    <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>' \
            "    <key>DTPlatformName</key><string>iphoneos</string>" \
            "    <key>DTPlatformVersion</key><string>$SDK_VER</string>" \
            "    <key>DTSDKName</key><string>iphoneos$SDK_VER</string>" \
            '    <key>LSApplicationCategoryType</key><string>public.app-category.action-games</string>' \
            '    <key>LSRequiresIPhoneOS</key><true/>' \
            "    <key>MinimumOSVersion</key><string>$IOS_DEPLOYMENT_TARGET</string>" \
            '    <key>UILaunchScreen</key><dict/>' \
            '    <key>CADisableMinimumFrameDurationOnPhone</key><true/>' \
            '    <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>' \
            '    <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>' \
            '    <key>UIRequiresFullScreen</key><true/>' \
            '    <key>UIStatusBarHidden</key><true/>' \
            '    <key>UIViewControllerBasedStatusBarAppearance</key><false/>' \
            '    <key>UISupportedInterfaceOrientations</key><array>' \
            '        <string>UIInterfaceOrientationLandscapeLeft</string>' \
            '        <string>UIInterfaceOrientationLandscapeRight</string>' \
            '    </array>' \
            '    <key>UISupportedInterfaceOrientations~ipad</key><array>' \
            '        <string>UIInterfaceOrientationLandscapeLeft</string>' \
            '        <string>UIInterfaceOrientationLandscapeRight</string>' \
            '    </array>' \
            '    <key>UIFileSharingEnabled</key><true/>' \
            '    <key>LSSupportsOpeningDocumentsInPlace</key><true/>' \
            '</dict>' \
            '</plist>' > "$APP_DIR/Info.plist"

          # xcodebuild always emits a *binary* plist, and so does every .ipa
          # that has ever been shipped.  Some on-device signers parse only the
          # binary form, so hand them the same thing Xcode would.
          plutil -convert binary1 "$APP_DIR/Info.plist"
          echo "----- Info.plist (binary) -----"
          plutil -p "$APP_DIR/Info.plist"

          # xcodebuild writes this too, and a few tools check for it.
          printf 'APPL????' > "$APP_DIR/PkgInfo"

          # Ad-hoc signature.  Needs no certificate at all, and whatever
          # sideloads the IPA (ESIGN, Sideloadly, SideStore, ...) re-signs it
          # with the user's own identity anyway, so a failure here must not stop
          # the packaging - but it has to be visible.  Piping codesign into tail
          # would report tail's status, which is why this is done explicitly.
          #
          # The flags are not decoration.  The ONE bundle in this repository
          # that is known to install - the milestone-0 smoke test - was signed
          # as
          #     codesign --force --sign - --entitlements Free.entitlements \
          #              --generate-entitlement-der "$APP"
          # where Free.entitlements is an EMPTY dictionary.  So the entitlement
          # *content* is irrelevant; what matters is that the signature carries
          # an entitlements blob at all and that its DER form is generated.
          # Modern iOS reads the DER entitlements in preference to the XML
          # ones, and a signature without them can be refused at install time -
          # which is the failure being chased here.  A bare
          # `codesign --force --sign -` (what this step used to do) produces
          # neither.
          #
          # That first attempt also taught a lesson worth keeping: an
          # entitlements file the OS parser rejects makes codesign fail
          # outright, and the bundle then ships UNSIGNED - strictly worse than
          # shipping it with a plainer signature.  So the file is linted first
          # and there is a fallback, below.
          ENT_FILE="$GITHUB_WORKSPACE/patches/ios/RoR.entitlements"
          if [ ! -f "$ENT_FILE" ]; then
            echo "::warning::$ENT_FILE missing - signing without entitlements"
            ENT_ARGS=""
          elif ! plutil -lint "$ENT_FILE" > ent-lint.log 2>&1; then
            echo "::warning::$ENT_FILE rejected by plutil - signing without entitlements"
            cat ent-lint.log
            ENT_ARGS=""
          else
            ENT_ARGS="--entitlements $ENT_FILE --generate-entitlement-der"
            echo "entitlements file accepted by plutil"
          fi

          # The identifier is spelled out for a reason.  Left to itself,
          # codesign named this bundle
          #     RoR-5555494495c14ca205fb3d8ab572baf55691bc9e
          # i.e. <CFBundleExecutable>-<LC_UUID>, which is what it falls back to
          # when it cannot obtain CFBundleIdentifier from the bundle.  The one
          # bundle known to install carries Identifier=io.github.ror.ios - the
          # real bundle id - and iOS pairs the two when it validates the app,
          # so a signature that disagrees with the plist is a plausible reason
          # for "Unable to Install".  Passing --identifier removes the
          # disagreement no matter what confuses codesign's bundle detection.
          ID_ARGS="--identifier $BUNDLE_ID"

          # Signs $1, falling back to a signature with no entitlements rather
          # than leaving the bundle unsigned.  Returns non-zero only if even
          # that fails, which under `set -e` stops the step; the upload step
          # still runs because it is gated on `if: always()`.
          adhoc_sign() {
            local target="$1"
            # shellcheck disable=SC2086
            if codesign --force --sign - $ID_ARGS $ENT_ARGS "$target" > adhoc.log 2>&1; then
              echo "  ad-hoc codesign: OK"
              return 0
            fi
            echo "  signing WITH entitlements failed:"
            cat adhoc.log
            # shellcheck disable=SC2086
            if codesign --force --sign - $ID_ARGS "$target" >> adhoc.log 2>&1; then
              echo "  fell back to signing WITHOUT entitlements"
              echo "  ::warning::this signature has no DER entitlements"
              return 0
            fi
            echo "  ad-hoc codesign: FAILED ENTIRELY - bundle is unsigned"
            cat adhoc.log
            return 1
          }

          # Why did codesign not use the plist's CFBundleIdentifier?  Three
          # throwaway bundles with the same binary answer it: the plist as XML,
          # the plist as binary, and binary with --identifier.  Only the answer
          # decides whether --identifier can be dropped again later.
          echo "----- identifier diagnostics -----"
          plutil -extract CFBundleIdentifier raw -o - "$APP_DIR/Info.plist" \
            | sed 's/^/  plist says: /' || true
          for idv in xml bin forced; do
            d="idtest-$idv.app"
            rm -rf "$d"; mkdir -p "$d"
            cp "$APP_DIR/RoR" "$d/RoR"
            printf 'APPL????' > "$d/PkgInfo"
            extra=""
            if [ "$idv" = xml ]; then
              plutil -convert xml1 -o "$d/Info.plist" "$APP_DIR/Info.plist"
            else
              cp "$APP_DIR/Info.plist" "$d/Info.plist"
            fi
            [ "$idv" = forced ] && extra="--identifier $BUNDLE_ID"
            # shellcheck disable=SC2086
            codesign --force --sign - $extra "$d" > /dev/null 2>&1
            echo "  $idv -> $(codesign -dvvv "$d" 2>&1 | grep -m1 '^Identifier=' || echo '(none)')"
            rm -rf "$d"
          done

          echo "----- signing the full bundle -----"
          adhoc_sign "$APP_DIR"
          rm -f adhoc.log ent-lint.log
          if [ -d "$APP_DIR/_CodeSignature" ]; then
            echo "bundle carries a _CodeSignature"
          else
            echo "bundle is unsigned (expected; the sideloader adds the signature)"
          fi
          echo "----- what the signature actually says -----"
          codesign -d --entitlements :- "$APP_DIR" 2>&1 | head -20 || true
          codesign -dvvv "$APP_DIR" 2>&1 \
            | grep -Ei 'Identifier|Format|CodeDirectory|Signature|Hash|flags|TeamIdentifier' \
            | head -20 || true

          # An .ipa is just a zip with the bundle at Payload/<name>.app.
          rm -rf Payload RoR-ios.ipa
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          zip -qry RoR-ios.ipa Payload
          echo "----- IPA -----"
          ls -la RoR-ios.ipa
          unzip -l RoR-ios.ipa | head -20
          echo "IPA size: $(du -h RoR-ios.ipa | cut -f1)"

          # ------------------------------------------------------------------ #
          # A smaller second IPA, for diagnosis only.                          #
          #                                                                    #
          # The full bundle is ~112 MB, almost all of it resource archives.    #
          # When iOS answers an install with the generic "Unable to Install"   #
          # it is usually either the installer choking on the size or a        #
          # signature problem.  A smaller build of the same app with the same  #
          # Info.plist and the same signing tells those apart in a single      #
          # install attempt: if the small one lands, it was about size.        #
          #                                                                    #
          # This has to stay a *deny* list.  ContentManager::AddResourcePack() #
          # throws std::runtime_error when a pack archive is missing, and main #
          # calls it during startup for WALLPAPERS, FLAGS, FONTS, ICONS,       #
          # OGRE_CORE, SCRIPTS and then MYGUI + DASHBOARDS.  An allow-list     #
          # which forgets one of those yields an app that cannot even reach    #
          # the first drawn frame, which is useless as a launch diagnostic -   #
          # the previous allow-list did exactly that (wallpapers.zip and       #
          # dashboards.zip were missing).  Only archives which nothing touches #
          # before a terrain or a vehicle is loaded may be listed below.       #
          # ------------------------------------------------------------------ #
          DROP="meshes.zip textures.zip sounds.zip caelum.zip SkyX.zip hydrax.zip"
          rm -rf LiteStage RoR-ios-lite.ipa
          mkdir -p LiteStage/Payload
          cp -R "$APP_DIR" LiteStage/Payload/RoR.app
          if [ -d LiteStage/Payload/RoR.app/rorres ]; then
            for z in LiteStage/Payload/RoR.app/rorres/*.zip; do
              [ -e "$z" ] || continue
              b="$(basename "$z")"
              for k in $DROP; do
                if [ "$b" = "$k" ]; then
                  echo "lite: dropping $b ($(du -h "$z" | cut -f1))"
                  rm -f "$z"
                fi
              done
            done
          fi
          # Trimming the bundle invalidated the signature above, so sign again
          # through the same fallback path.
          echo "----- signing the lite bundle -----"
          adhoc_sign "LiteStage/Payload/RoR.app" || true
          rm -f adhoc.log
          (cd LiteStage && zip -qry ../RoR-ios-lite.ipa Payload)
          echo "----- lite IPA -----"
          ls -la RoR-ios-lite.ipa
          du -sh "$APP_DIR/rorres" LiteStage/Payload/RoR.app/rorres 2>/dev/null || true

          # ------------------------------------------------------------------ #
          # A third IPA, also diagnostic.                                      #
          #                                                                    #
          # Everything here is byte-for-byte identical to the bundles above     #
          # except the executable: same Info.plist, same PkgInfo, same          #
          # ad-hoc codesign call, same Payload/ + zip construction.  It is      #
          # ~50 KB instead of 18 MB.                                            #
          #                                                                    #
          # That isolates the two things the milestone-0 smoke test cannot:     #
          # the game binary, and this packaging.  If this one installs and      #
          # RoR-ios-lite.ipa does not, the packaging is proven good and the     #
          # game binary is the problem.                                         #
          # ------------------------------------------------------------------ #
          TINY_SRC="$GITHUB_WORKSPACE/patches/ios/TinyApp.m"
          rm -rf TinyStage RoR-ios-tiny.ipa
          if [ -f "$TINY_SRC" ] && \
             xcrun -sdk iphoneos clang -target "arm64-apple-ios$IOS_DEPLOYMENT_TARGET" \
               -fobjc-arc -framework UIKit -framework Foundation \
               -o /tmp/RoR-tiny "$TINY_SRC" > tiny-cc.log 2>&1; then
            echo "tiny: compiled ok"
            mkdir -p TinyStage/Payload/RoR.app
            cp /tmp/RoR-tiny TinyStage/Payload/RoR.app/RoR
            cp "$APP_DIR/Info.plist" TinyStage/Payload/RoR.app/Info.plist
            cp "$APP_DIR/PkgInfo" TinyStage/Payload/RoR.app/PkgInfo
            adhoc_sign "TinyStage/Payload/RoR.app" || true
            rm -f adhoc.log
            (cd TinyStage && zip -qry ../RoR-ios-tiny.ipa Payload)
            echo "----- tiny IPA -----"
            ls -la RoR-ios-tiny.ipa
            file TinyStage/Payload/RoR.app/RoR
          else
            echo "::warning::tiny diagnostic app did not compile"
            cat tiny-cc.log 2>/dev/null | tail -20 || true
          fi
          rm -f tiny-cc.log

          # ------------------------------------------------------------------ #
          # Focused controls.  Measured on device: an .app whose bundle         #
          # carries a top-level directory *named* resources/ - or Resources/,   #
          # the check is case-insensitive - is refused by the installer, while  #
          # the very same directory under any other name installs and runs.     #
          # codesign is what flips: it switches to the macOS "resource          #
          # envelope" rules (rules=^Resources/) whenever such a directory is    #
          # present, and iOS will not install a bundle sealed that way.         #
          # See the resource-directory note above and PORT_FINDINGS 7.22.       #
          #                                                                     #
          #   bin   - the real binary, no data at all: the known-good baseline  #
          #   res0  - bin + resources/rotest.txt : the known-bad reference      #
          #   res0r - bin + rorres/rotest.txt    : one file, one directory name #
          #           apart from res0.  If this installs, the rename is the     #
          #           whole fix, and the real bundles - which now ship their    #
          #           data in rorres/ - install too.                            #
          # ------------------------------------------------------------------ #
          echo "------ building controls (bin, res0, res0r) ------"
          if [ -f "$APP_DIR/RoR" ]; then
            rm -rf BinStage Res0Stage Res0rStage
            for s in BinStage Res0Stage Res0rStage; do
              mkdir -p "$s/Payload/RoR.app"
              cp "$APP_DIR/RoR" "$s/Payload/RoR.app/RoR"
              cp "$APP_DIR/Info.plist" "$s/Payload/RoR.app/Info.plist"
              cp "$APP_DIR/PkgInfo" "$s/Payload/RoR.app/PkgInfo"
            done
            mkdir -p Res0Stage/Payload/RoR.app/resources Res0rStage/Payload/RoR.app/rorres
            printf 'ror\n' > Res0Stage/Payload/RoR.app/resources/rotest.txt
            printf 'ror\n' > Res0rStage/Payload/RoR.app/rorres/rotest.txt
            if command -v adhoc_sign >/dev/null 2>&1; then
              adhoc_sign "BinStage/Payload/RoR.app" || true
              adhoc_sign "Res0Stage/Payload/RoR.app" || true
              adhoc_sign "Res0rStage/Payload/RoR.app" || true
            fi
            (cd BinStage && zip -qry ../RoR-ios-bin.ipa Payload)
            (cd Res0Stage && zip -qry ../RoR-ios-res0.ipa Payload)
            (cd Res0rStage && zip -qry ../RoR-ios-res0r.ipa Payload)
            echo "----- control signatures (what codesign decided) -----"
            for ipa in RoR-ios-bin.ipa RoR-ios-res0.ipa RoR-ios-res0r.ipa RoR-ios-lite.ipa; do
              [ -f "$ipa" ] || continue
              python3 -c "import plistlib,sys,zipfile;z=zipfile.ZipFile(sys.argv[1]);n=[x for x in z.namelist() if x.endswith('_CodeSignature/CodeResources')];d=plistlib.loads(z.read(n[0]));print(sys.argv[1],'-> rules:',list((d.get('rules') or {}).keys()))" "$ipa" 2>/dev/null \
                || echo "$ipa -> no CodeResources (unsigned)"
            done
            ls -la RoR-ios-bin.ipa RoR-ios-res0.ipa RoR-ios-res0r.ipa
          fi

      # A bundle can be complete and still be unable to start, and what that
      # looks like on the phone is a black screen in a process that never dies:
      # no crash, no dialog, nothing on screen to read.  Finding that out costs
      # a build, an install and a walk through the Files app; this costs a
      # second, which is why it is a hard step and not continue-on-error.
      - name: Check the IPA really can start
        if: always()
        run: |
          set -euo pipefail
          if [ -f RoR-ios.ipa ]; then
            python3 patches/verify_ipa.py RoR-ios.ipa
          else
            echo "no IPA produced - nothing to verify"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## RoR for iOS - compile error census"
            echo
            echo "dependency SDK run: \`$DEPS_RUN_ID\`"
            echo
            echo "### Configure problems"
            echo '```'
            grep -iE 'CMake Error|Could NOT find|not found|FATAL' logs/ror-configure.log | head -40 || echo "(none)"
            echo '```'
            echo "### Configure feature summary"
            echo '```'
            sed -n '/Features/,$p' logs/ror-configure.log | head -70 || echo "(none)"
            echo '```'
            echo "### compiler errors: $(grep -cE 'error:' logs/ror-build.log || echo 0)"
            echo
            echo "### link"
            echo '```'
            grep -E 'Linking CXX executable|Built target RoR|Undefined symbols|symbol\(s\) not found|make.*Error' logs/ror-build.log | head -20 || echo "(no link phase reached)"
            echo '```'
            echo "### first 120 errors"
            echo '```'
            grep -E 'error:' logs/ror-build.log | head -120 || echo "(none)"
            echo '```'
            echo "### top error kinds"
            echo '```'
            grep -oE 'error: .{0,70}' logs/ror-build.log | sort | uniq -c | sort -rn | head -40 || echo "(none)"
            echo '```'
            echo "### source files with errors (count)"
            echo '```'
            grep -E '^[^ ]+:[0-9]+:[0-9]+: error:' logs/ror-build.log \
              | cut -d: -f1 | sort | uniq -c | sort -rn | head -80 || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ror-ios-build-logs
          path: logs/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoR-ios-ipa
          # ONLY the IPAs.  An earlier revision also uploaded the loose bundle
          # files, which made the downloaded archive a zip-of-a-zip and invited
          # the user to hand the wrong file to the signer.
          path: |
            RoR-ios.ipa
            RoR-ios-lite.ipa
            RoR-ios-tiny.ipa
            RoR-ios-bin.ipa
            RoR-ios-res0.ipa
            RoR-ios-res0r.ipa
          retention-days: 30
          if-no-files-found: warn

      # A release asset is served as the raw file, so this is the download that
      # cannot be confused with an archive.  Rolling tag, replaced every run.
      - name: Publish the IPA as a release asset
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          [ -f RoR-ios.ipa ] || { echo "no IPA produced, skipping release"; exit 0; }
          # `latest-ipa` is the tag the user already has bookmarked.  It used to
          # hold the milestone-0 Hello-World smoke test; build-ipa.yml has been
          # moved to its own `pipeline-check` tag so this one is unambiguously
          # the game.
          TAG="${RELEASE_TAG:-latest-ipa}"
          TITLE="Rigs of Rods for iOS - unsigned IPA (rolling)"
          NOTES="Unsigned, ad-hoc-signed RoR IPA for arm64 iPhone/iPad, built from ${GITHUB_SHA:0:9}.

          Files (release-dependent):

          * RoR-ios.ipa      - the full game, ~112 MB. Ships its data in
                               RoR.app/rorres/ (not resources/ - see below).
          * RoR-ios-lite.ipa - the same app with the content-only archives
                               dropped (meshes/textures/sounds/caelum/SkyX/
                               hydrax), ~40 MB.  Every archive the startup path
                               loads is kept, so it launches exactly like the
                               full build - this is what makes it a usable
                               launch diagnostic.
          * RoR-ios-tiny.ipa - NOT the game. Shares Info.plist/signature/packaging
                               with the game. Installs and launches (green screen).
          * RoR-ios-bin.ipa  - diagnostic (only on 'diag' tag). Real RoR binary,
                               no data directory at all. The known-good baseline.
          * RoR-ios-res0.ipa - diagnostic (only on 'diag' tag). bin plus a single
                               file in resources/ . The known-BAD reference.
          * RoR-ios-res0r.ipa - diagnostic (only on 'diag' tag). bin plus the same
                               single file, in rorres/ instead. What the fix does.

          Why the directory is called rorres:

          An .app whose bundle contains a top-level directory *named* resources
          (or Resources - the check is case-insensitive) is refused by the iOS
          installer with the generic \"Unable to Install\", while the very same
          directory under any other name (zzz/, Base.lproj/, rorres/) installs
          and runs.  Measured on device:  bin - no directory        -> installs
                                            zzz/rotest.txt        -> installs
                                            Base.lproj/rotest.txt -> installs
                                            resources/rotest.txt  -> refused
                                            Resources/rotest.txt  -> refused

          codesign is what flips.  With a resources/ (or Resources/) directory
          present it switches its resource rules to the macOS \"resource
          envelope\" set - rules=^Resources/, plus a '^[^/]+$ -> nested' rule in
          rules2 - and iOS will not install a bundle sealed that way.  With any
          other directory name it keeps the plain ^.* rules that iOS accepts.
          The ad-hoc signature was never the problem: an unsigned variant with
          resources/ is refused just the same.

          If the game installs but crashes right after launching:

          It now writes Documents/ror-trace.log - one line per startup phase,
          plus every OGRE log line and, if it dies, the reason (SIGSEGV, or the
          uncaught exception's message).  That file is flushed line by line with
          write(2), so it is complete even when the process is killed mid-line.
          Open it on the phone: Files app -> On My iPhone -> Rigs of Rods ->
          ror-trace.log.  The last lines are the interesting ones.  The same
          folder holds RigsOfRods/logs/RoR.log, which OGRE writes - but that one
          is buffered and loses its tail on a crash, so prefer ror-trace.log.

          Hand the file itself to ESIGN / Sideloadly / SideStore - it is served
          as a plain file, nothing to unpack.  An .ipa is a zip whose root
          contains Payload/."

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes "$NOTES"
          fi

          # Drop every asset we are not about to upload.
          ALLOWED="RoR-ios.ipa|RoR-ios-lite.ipa|RoR-ios-tiny.ipa"
          if [ "$TAG" = "diag" ]; then
            ALLOWED="RoR-ios.ipa|RoR-ios-lite.ipa|RoR-ios-tiny.ipa|RoR-ios-bin.ipa|RoR-ios-res0.ipa|RoR-ios-res0r.ipa"
          fi
          for a in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                       --json assets --jq '.assets[].name'); do
            case "$a" in
              $ALLOWED) ;;
              *) echo "removing stale asset: $a"
                 gh release delete-asset "$TAG" "$a" --repo "$GITHUB_REPOSITORY" --yes || true ;;
            esac
          done

          gh release upload "$TAG" RoR-ios.ipa --clobber --repo "$GITHUB_REPOSITORY"
          for f in RoR-ios-lite.ipa RoR-ios-tiny.ipa; do
            if [ -f "$f" ]; then
              gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY"
            fi
          done
          if [ "$TAG" = "diag" ]; then
            for f in RoR-ios-bin.ipa RoR-ios-res0.ipa RoR-ios-res0r.ipa; do
              [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY"
            done
          fi

          # Sizes and hashes.  A truncated download makes every installer fail
          # and its error looks like a build problem ("Truncated input file",
          # "Unable to Install"), so the file itself has to be checkable before
          # anything is blamed on the build.
          CHECK="
          CHECK THE DOWNLOAD BEFORE INSTALLING

          A truncated download makes every installer fail, and the error looks
          like a build problem (\"Truncated input file\", \"Unable to Install\").
          Compare the byte size of the file you downloaded with the list below;
          if it differs by even one byte, download the file again.

          "
          for f in RoR-ios.ipa RoR-ios-lite.ipa RoR-ios-tiny.ipa RoR-ios-bin.ipa RoR-ios-res0.ipa RoR-ios-res0r.ipa; do
            if [ -f "$f" ]; then
              CHECK="${CHECK}$(printf '  %-22s %10d   sha256:%s' "$f" "$(wc -c < "$f" | tr -d ' ')" "$(shasum -a 256 "$f" | cut -d' ' -f1)")
          "
            fi
          done
          NOTES="${NOTES}
          ${CHECK}"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" --notes "$NOTES"

          echo "----- release contents -----"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "asset: \(.name) \(.size) bytes"'
